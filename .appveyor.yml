version: 0.2.7.build{build}

image: Visual Studio 2019

clone_folder: C:\projects\welsonjs

init:
  # The repository stores LF; the installer must ship CRLF batch files.
  - git config --global core.autocrlf true

environment:
  ORGANIZATION_ID: 8ee5ec82-36dc-4619-ac33-5bc1117428fe
  PROJECT_SLUG: welsonjs
  ARTIFACT_CONFIGURATION_SLUG: initial
  INNOSETUP_VERSION: 6.7.1
  CURL_GZ_URL: https://catswords.blob.core.windows.net/welsonjs/packages/native/curl/8.20.0-x86/curl.exe.gz
  CURL_GZ_SHA256: 222fcf710a6426841ff11f01548e588aa478ea997fe49b5cd54926a5841cb660
  CURL_CA_BUNDLE_GZ_URL: https://catswords.blob.core.windows.net/welsonjs/packages/native/curl/8.20.0-x86/curl-ca-bundle.crt.gz
  CURL_CA_BUNDLE_GZ_SHA256: 84cf5b3ccb716914fba03bef16c0eaf5cbc00dfb7b7f41b8bab48754b5879859
  SEVENZR_GZ_URL: https://catswords.blob.core.windows.net/welsonjs/packages/native/7zr/26.05-x86/7zr.exe.gz
  SEVENZR_GZ_SHA256: c63c0233d08a49606626613f28e87879f223bc949d20cca9bcc9f3ea31921a43
  matrix:
    - CONFIGURATION: Debug
      SIGNING_POLICY_SLUG: test-signing
    - CONFIGURATION: Release
      SIGNING_POLICY_SLUG: release-signing
      # Keep the llama.cpp build in the cache even if a later step fails.
      APPVEYOR_SAVE_CACHE_ON_ERROR: "true"

install:
  - choco install innosetup --version=%INNOSETUP_VERSION% -y --no-progress

cache:
  # llama.cpp build output (native\llamacpp\build-llamacpp.ps1), written by the
  # Release job only. Each job has its own cache. Invalidated when the pinned
  # commit, the version, the script, a patch or the icon changes; the script
  # also checks its build ID (every patch and the icon) and SHA256SUMS.txt.
  - artifacts\llamacpp -> native\llamacpp\commit.txt, native\llamacpp\version.txt, native\llamacpp\build-llamacpp.ps1, native\llamacpp\patches\0001-ggml-cpu-add-STQ1_0-pr22836.patch, native\llamacpp\patches\0002-tools-windows-icon.patch, native\llamacpp\patches\0003-ggml-build-without-bitnet-repository.patch, native\llamacpp\patches\0004-ggml-i2s-reference-quants-in-ggml-base.patch, native\llamacpp\patches\0005-models-bitnet-b158-squared-relu.patch, native\llamacpp\patches\0006-ggml-cpu-fix-non-avx2-i2s-fallbacks.patch, native\llamacpp\patches\0007-llama-bitnet-b158-chat-template.patch, native\llamacpp\patches\0008-llama-bitnet-b158-llama-bpe-pre-tokenizer.patch, native\llamacpp\patches\0009-ggml-cpu-x86-stq1_0-vec-dot.patch, app\favicon.ico

before_build:
  - ps: |
      # llama.cpp with the patches in native\llamacpp\patches, built first in the
      # Release job so that it finishes early within the 60-minute job limit. The
      # files go to artifacts\llamacpp\x64 and are packaged into artifacts.zip
      # (and signed) with the other artifacts. Skipped when the cached output was
      # built from the same inputs. The source is bitnet.cpp's llama.cpp fork
      # (with BitNet's I2_S kernels), built with MSVC.
      if ($env:CONFIGURATION -eq "Release") {
          $ErrorActionPreference = "Stop"
          & .\native\llamacpp\build-llamacpp.ps1 -OutDir "artifacts\llamacpp" -WorkDir "C:\llamacpp-build"
          if ($LASTEXITCODE -ne 0) { throw "build-llamacpp.ps1 failed with exit code $LASTEXITCODE" }
      }
  - git submodule update --init --recursive
  - git -C native\ManagedEsent apply --ignore-whitespace ..\patches\ManagedEsent-no-system-memory.patch
  - ps: |
      function Set-TargetFramework {
          param (
              [string]$project,
              [string]$targetFramework
          )
          $content = Get-Content $project -Raw
          if ($content -match '<TargetFrameworkVersion>') {
              $content = $content -replace `
                  '<TargetFrameworkVersion>[^<]+</TargetFrameworkVersion>', `
                  "<TargetFrameworkVersion>$targetFramework</TargetFrameworkVersion>"
          }
          elseif ($content -match '<TargetFrameworks>') {
              $content = $content -replace `
                  '<TargetFrameworks>[^<]+</TargetFrameworks>', `
                  "<TargetFrameworks>$targetFramework</TargetFrameworks>"
          }
          elseif ($content -match '<TargetFramework>') {
              $content = $content -replace `
                  '<TargetFramework>[^<]+</TargetFramework>', `
                  "<TargetFramework>$targetFramework</TargetFramework>"
          }
          Set-Content $project $content
      }
      Set-TargetFramework "native\WelsonJS.Augmented\WelsonJS.ManagedObject\WelsonJS.ManagedObject.csproj" "v2.0"
  - nuget restore native\WelsonJS.Augmented

build_script:
  - msbuild "C:\projects\welsonjs\native\WelsonJS.Augmented\WelsonJS.Augmented.sln" /verbosity:minimal /logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll" /p:Configuration=%CONFIGURATION% /p:Platform="x86"
  - cmake -S native\welsonjs-hta -B out\build\welsonjs-hta -A Win32
  - cmake --build out\build\welsonjs-hta --config %CONFIGURATION% --target welsonjs-hta

after_build:
   - cmd: if not exist artifacts mkdir artifacts
   - cmd: xcopy /y out\build\welsonjs-hta\bin\%CONFIGURATION%\*.exe artifacts\
   - cmd: xcopy /y out\build\welsonjs-hta\bin\%CONFIGURATION%\*.dll artifacts\
   - cmd: xcopy /y out\build\welsonjs-hta\bin\%CONFIGURATION%\webview.js artifacts\
   - cmd: xcopy /s /y native\WelsonJS.Augmented\WelsonJS.ManagedObject\bin\%CONFIGURATION%\* artifacts\
   - cmd: xcopy /s /y native\WelsonJS.Augmented\WelsonJS.Service\bin\x86\%CONFIGURATION%\* artifacts\
   - cmd: xcopy /s /y native\WelsonJS.Augmented\WelsonJS.Launcher\bin\x86\%CONFIGURATION%\* artifacts\
   - cmd: xcopy /s /y native\WelsonJS.Augmented\Catswords.Phantomizer\bin\%CONFIGURATION%\netstandard2.0\* artifacts\
   - cmd: nuget pack native\WelsonJS.Augmented\WelsonJS.ManagedObject\ -properties Configuration=%CONFIGURATION% -properties Platform=AnyCPU -OutputDirectory artifacts\
   - ps: |
       $ErrorActionPreference = "Stop"
       $ProgressPreference = "SilentlyContinue"
       [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

       function Get-VerifiedFile {
           param ([string]$Url, [string]$Sha256, [string]$Destination)
           Invoke-WebRequest -Uri $Url -OutFile $Destination -UseBasicParsing
           $actual = (Get-FileHash $Destination -Algorithm SHA256).Hash
           if ($actual -ne $Sha256) {
               throw "SHA-256 mismatch for ${Url}: expected $Sha256, got $actual"
           }
       }

       function Expand-GzipFile {
           param ([string]$Source, [string]$Destination)
           $sourceStream = [IO.File]::OpenRead($Source)
           try {
               $gzip = New-Object IO.Compression.GZipStream($sourceStream, [IO.Compression.CompressionMode]::Decompress)
               $destinationStream = [IO.File]::Create($Destination)
               try {
                   $gzip.CopyTo($destinationStream)
               } finally {
                   $destinationStream.Dispose()
               }
           } finally {
               $sourceStream.Dispose()
           }
       }

       # Stage the files that setup.iss reads from the git-ignored bin\x86 folder.
       $binDir = (New-Item -ItemType Directory -Force -Path "bin\x86").FullName
       @(
           "WelsonJS.Launcher.exe",
           "WelsonJS.Launcher.exe.config",
           "WelsonJS.Esent.dll",
           "Esent.Interop.dll",
           "integrity.config.xml",
           "WelsonJS.ManagedObject.dll",
           "Catswords.Phantomizer.dll",
           "ChakraCore.dll",
           "welsonjs-hta.exe",
           "welsonjs-hta-webview2.exe",
           "welsonjs-hta-edgehtml.exe",
           "welsonjs-hta-mshtml.exe",
           "WebView2Loader.dll",
           "webview.js"
       ) | ForEach-Object { Copy-Item "artifacts\$_" "bin\x86\" }

       Get-VerifiedFile $env:SEVENZR_GZ_URL $env:SEVENZR_GZ_SHA256 "$env:TEMP\7zr.exe.gz"
       Expand-GzipFile "$env:TEMP\7zr.exe.gz" "$binDir\7zr.exe"
       Get-VerifiedFile $env:CURL_GZ_URL $env:CURL_GZ_SHA256 "$env:TEMP\curl.exe.gz"
       Expand-GzipFile "$env:TEMP\curl.exe.gz" "$binDir\curl.exe"
       Get-VerifiedFile $env:CURL_CA_BUNDLE_GZ_URL $env:CURL_CA_BUNDLE_GZ_SHA256 "$env:TEMP\curl-ca-bundle.crt.gz"
       Expand-GzipFile "$env:TEMP\curl-ca-bundle.crt.gz" "$binDir\curl-ca-bundle.crt"

       # Restore the application assets (app\assets) that setup.iss packages.
       & .\restoreAppAssets.ps1 -Root (Get-Location).Path
       if ($LASTEXITCODE -ne 0) { throw "restoreAppAssets.ps1 failed with exit code $LASTEXITCODE" }

       $iscc = (Resolve-Path "C:\Program Files*\Inno Setup 6\ISCC.exe" | Select-Object -First 1).Path
       if (-not $iscc) { throw "ISCC.exe was not found" }
       & $iscc "/O$((Resolve-Path artifacts).Path)" "/Fwelsonjs_setup" "setup.iss"
       if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
   - cmd: 7z a artifacts.zip artifacts\*

artifacts:
  - path: artifacts.zip
    name: WelsonJS.Augmented

deploy:
- provider: Webhook
  url: https://app.signpath.io/API/v1/%ORGANIZATION_ID%/Integrations/AppVeyor?ProjectSlug=%PROJECT_SLUG%&SigningPolicySlug=%SIGNING_POLICY_SLUG%&ArtifactConfigurationSlug=%ARTIFACT_CONFIGURATION_SLUG%
  authorization:
    secure: nABfe+lksIRfS7lVnkq3EdIYNH8KOka+5ZFTUJqUW2nckBubhrlAXarbCPJHLp9FWWf3zxAWhNwT0It+qyqPRQ==

notifications:
  - provider: Email
    to:
      - gnh1201@catswords.re.kr
    subject: "Build {{status}}: {{projectName}} {{buildVersion}}"
    on_build_success: false
    on_build_failure: true
