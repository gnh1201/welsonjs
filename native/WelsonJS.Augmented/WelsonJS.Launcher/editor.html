<!DOCTYPE html>
<html>
<head>
    <title>WelsonJS Editor</title>
    <meta name="title" content="WelsonJS Editor">
    <meta name="description" content="WelsonJS can build a Windows app on the Windows built-in JavaScript engine.">
    <meta name="keywords" content="ecmascript, javascript, windows">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
    <meta name="author" content="2025 Catswords OSS and WelsonJS Contributors (GPL-3.0-or-later)">
    <style>
        html, body, #app, #app > .app {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Ribbon, editor area and banner stack vertically; the editor area takes the rest. */
        #app > .app {
            display: flex;
            flex-direction: column;
        }

        #container {
            border: 1px solid grey;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            overflow: hidden;
        }

        /* min-width/min-height: 0 let the panes shrink below their content size when the
           window gets smaller. The prompt messages editor opens in its own window
           (prompt.html). */
        #editor, #mapView {
            min-width: 0;
            min-height: 0;
        }

        #editor {
            flex: 1;
        }

        #mapView {
            flex: 1;
        }

        .banner {
            padding: 10px;
            background-color: #f1f1f1;
            font-size: 14px;
        }

        .banner a {
            text-decoration: none;
            color: #000;
        }

        .banner a:hover {
            text-decoration: none;
            font-weight: bold;
            color: inherit; /* keeps contrast consistent */
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        var require = {
            paths: {
                vs: 'http://localhost:3000/ajax/libs/monaco-editor/0.52.2/min/vs'
            }
        };
    </script>
    <script src="http://localhost:3000/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/axios/1.8.4/axios.min.js" integrity="sha384-06w+raHvkSL3+E7mbQ2X6DZwI5A3veU8Ba+NLrAPxxRGw4Xy78sihHDHQMustMM4" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/fast-xml-parser/4.5.1/fxparser.min.js" integrity="sha384-ae/HepOQ8hiJ/VA6yGwPMGXQXOkT/lJpjlcQ7EUgibUcfnBltuozgNj4IgOZ9QLc" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/dompurify/3.2.4/purify.min.js" integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/monaco-editor/0.52.2/min/vs/loader.js" integrity="sha384-pHG02SG8pId94Np3AbPmBEJ1yPqaH0IkJGLSNGXYmuGhkazT8Lr/57WYpbkGjJtu" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.js" integrity="sha384-fj9z+NUc93I3woCCy5IRQfrQ8Amu1E27tllwgb5gz3d9Vr1ymS13xcF6two3e4KH" crossorigin="anonymous"></script>
    <script>
        function loadResource(url, mimeType, integrity) {
            mimeType = mimeType || 'application/javascript';

            return new Promise((resolve, reject) => {
                let el;

                if (mimeType === 'text/css') {
                    el = document.createElement('link');
                    el.rel = 'stylesheet';
                    el.type = mimeType;
                    el.href = url;
                } else {
                    el = document.createElement('script');
                    el.type = mimeType;
                    el.src = url;
                }

                if (integrity) {
                    el.integrity = integrity;
                    el.crossOrigin = 'anonymous';
                }

                el.onload = resolve;
                el.onerror = reject;

                (mimeType === 'text/css' ? document.head : document.body).appendChild(el);
            });
        }

        Promise.all([
            loadResource("http://localhost:3000/ajax/libs/metroui/dev/lib/metro.css", "text/css", "sha384-4XgOiXH2ZMaWt5s5B35yKi7EAOabhZvx7wO8Jr71q2vZ+uONdRza/6CsK2kpyocd"),
            loadResource("http://localhost:3000/ajax/libs/metroui/dev/lib/icons.css", "text/css", "sha384-FuLND994etg+RtnpPSPMyNBvL+fEz+xGhbN61WUWuDEeZ+wJzcQ8SGqAMuI5hWrt"),
            loadResource("http://localhost:3000/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.css", "text/css", "sha384-06yHXpYRlHEPaR4AS0fB/W+lMN09Zh5e1XMtfkNQdHV38OlhfkOEW5M+pCj3QskC"),
            loadResource("http://localhost:3000/ajax/libs/leaflet/1.9.4/leaflet.min.css", "text/css", "sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb")
        ]).then(() => {
            const _e = React.createElement;

            function Button({ id, icon, caption, onClick }) {
                return _e(
                    'button',
                    { id, className: 'ribbon-button', onClick },
                    _e('span', { className: `icon ${icon}` }),
                    _e('span', { className: 'caption' }, caption)
                );
            }

            function Group({ title, buttons }) {
                return _e(
                    'div',
                    { className: 'group' },
                    buttons.map((btn, index) =>
                        _e(Button, { key: index, ...btn })
                    ),
                    _e('span', { className: 'title' }, title)
                );
            }

            function RibbonMenu({
                onOpenFileClick, onSaveFileClick, onLlamaCppClick, onPromptEditorClick,
                onSavePromptClick, onLoadPromptClick, onQueryWhoisClick, onQueryDnsClick,
                onQueryIpClick, onMapClick, onRunScriptClick, onTerminalClick,
                onExcelExampleClick, onPowerPointExampleClick, onWordExampleClick, onHwpExampleClick,
                onDiscordClick, onKakaoClick, onWorldTouristExampleClick
            }) {
                const fileButtons = [
                    {
                        id: 'btnOpenFile',
                        icon: 'mif-folder-open',
                        caption: 'Open File',
                        onClick: onOpenFileClick
                    },
                    {
                        id: 'btnSaveFile',
                        icon: 'mif-floppy-disks',
                        caption: 'Save File',
                        onClick: onSaveFileClick
                    },
                    {
                        id: 'btnRunScript',
                        icon: 'mif-play',
                        caption: 'Run File',
                        onClick: onRunScriptClick
                    },
                    {
                        id: 'btnTerminal',
                        icon: 'mif-prompt',
                        caption: 'Terminal',
                        onClick: onTerminalClick
                    }
                ];

                const cognitiveToolsButtons = [
                    { id: 'btnLlamaCpp', icon: 'mif-rocket', caption: 'llama.cpp', onClick: onLlamaCppClick },
                    { id: 'btnPromptEditor', icon: 'mif-pencil', caption: 'Prompt', onClick: onPromptEditorClick },
                    { id: 'btnSavePrompt', icon: 'mif-floppy-disks', caption: 'Save', onClick: onSavePromptClick },
                    { id: 'btnLoadPrompt', icon: 'mif-file-upload', caption: 'Load', onClick: onLoadPromptClick }
                ];

                const networkToolsButtons = [
                    { id: 'btnWhois', icon: 'mif-earth', caption: 'Whois', onClick: onQueryWhoisClick },
                    { id: 'btnQueryDns', icon: 'mif-earth', caption: 'DNS', onClick: onQueryDnsClick },
                    { id: 'btnQueryIp', icon: 'mif-user-secret', caption: 'IP', onClick: onQueryIpClick },
                    { id: 'btnMap', icon: 'mif-rocket', caption: 'Map', onClick: onMapClick }
                ];

                const examplesButtons = [
                    { id: 'btnExcelExample', icon: 'mif-file-text', caption: 'Excel', onClick: onExcelExampleClick },
                    { id: 'btnPowerPointExample', icon: 'mif-file-text', caption: 'PowerPoint', onClick: onPowerPointExampleClick },
                    { id: 'btnWordExample', icon: 'mif-file-text', caption: 'Word', onClick: onWordExampleClick },
                    { id: 'btnHwpExample', icon: 'mif-file-text', caption: 'HWP', onClick: onHwpExampleClick },
                    { id: 'btnWorldTouristExample', icon: 'mif-map2', caption: 'Places', onClick: onWorldTouristExampleClick }
                ];

                const communityButtons = [
                    { id: 'btnDiscord', icon: 'mif-earth', caption: 'Discord', onClick: onDiscordClick },
                    { id: 'btnKakao', icon: 'mif-earth', caption: 'Kakao+', onClick: onKakaoClick }
                ];

                return _e(
                    'nav',
                    { 'className': 'ribbon-menu' },
                    _e('ul', { className: 'tabs-holder' },
                        _e('li', { className: 'static' }, _e('a', { href: '#heading-tab' }, 'WelsonJS')),
                        _e('li', { className: 'active' }, _e('a', { href: '#editor-tab' }, 'Editor'))
                    ),
                    _e('div', { className: 'content-holder' },
                        _e('div', { className: 'section active', id: 'editor-tab' },
                            _e(Group, { title: 'File', buttons: fileButtons }),
                            _e(Group, { title: 'Cognitive Tools (AI)', buttons: cognitiveToolsButtons }),
                            _e(Group, { title: 'Network Tools', buttons: networkToolsButtons }),
                            _e(Group, { title: 'Office Automation', buttons: examplesButtons }),
                            _e(Group, { title: 'Community', buttons: communityButtons })
                        )
                    )
                );
            }

            function Editor({ editorRef, visible, onReady }) {
                const containerRef = React.useRef(null);

                const getSuggestions = (word, range) => axios.get(`/completion/${encodeURIComponent(word)}`)
                    .then(response => {
                        const parser = new XMLParser();
                        const result = parser.parse(response.data);

                        const suggestions = ((item) => Array.isArray(item) ? item : [item])(result.suggestions.item).map((item) => {
                            return {
                                label: item.label,
                                kind: monaco.languages.CompletionItemKind.Text,
                                documentation: item.documentation || "",
                                insertText: '"' + item.insertText + '"',
                                range: range
                            };
                        });

                        return {
                            suggestions: suggestions
                        };
                    })
                    .catch(function () {
                        return {
                            suggestions: []
                        };
                    });

                React.useEffect(() => {
                    if (!containerRef.current)
                        return;

                    require(['vs/editor/editor.main'], () => {
                        const defaultValue = ['// hello.js', 'function main() {', '    console.log("Hello World");', '}', '', 'exports.main = main;', '', 'exports.VERSIONINFO = "Hello World (hello.js) version 0.1";', 'exports.AUTHOR = "oss@catswords.re.kr";', 'exports.global = global;', 'exports.require = global.require;'].join('\n');
                        let initialValue = defaultValue;

                        try {
                            const savedValue = localStorage.getItem('welsonjs.editor.source');
                            if (savedValue !== null)
                                initialValue = savedValue;
                        } catch (e) {}

                        const instance = monaco.editor.create(containerRef.current, {
                            value: initialValue,
                            language: 'javascript',
                            // re-layout whenever the container size changes (window resize, map toggle)
                            automaticLayout: true
                        });

                        instance.onDidChangeModelContent(() => {
                            try {
                                localStorage.setItem('welsonjs.editor.source', instance.getValue());
                            } catch (e) {}
                        });

                        monaco.languages.registerCompletionItemProvider('javascript', {
                            provideCompletionItems: function (model, position) {
                                const word = model.getWordUntilPosition(position);
                                const range = {
                                    startLineNumber: position.lineNumber,
                                    endLineNumber: position.lineNumber,
                                    startColumn: word.startColumn,
                                    endColumn: word.endColumn
                                };

                                return getSuggestions(word.word, range);
                            }
                        });

                        editorRef.current = instance;
                        if (onReady) onReady(instance);
                    });
                }, []);
                
                React.useEffect(() => {
                    // toggle the display style attribute
                    containerRef.current.style.display = (visible ? "" : "none");
                }, [visible]);

                return _e('div', { id: 'editor', ref: containerRef });
            }

            function useLocationMarker(mapViewRef) {
                const markerRef = React.useRef(null);

                const mark = React.useCallback((lat, lng, description) => {
                    const map = mapViewRef.current;
                    if (!map) return;

                    const latlng = L.latLng(lat, lng);

                    if (!markerRef.current) {
                        markerRef.current = L.marker(latlng).addTo(map)
                            .bindPopup(description || "(no description)")
                            .openPopup();
                    } else {
                        markerRef.current.setLatLng(latlng);
                    }
                }, [mapViewRef]);

                return { mark, markerRef };
            }
            
            function MapView({ mapViewRef, visible }) {
                const containerRef = React.useRef(null);
                
                const { mark } = useLocationMarker(mapViewRef);

                // init once
                React.useEffect(() => {
                    if (!containerRef.current)
                        return;

                    if (typeof L === "undefined" || !L || !L.map) {
                        console.error("[MapView] Leaflet (L) is not loaded.");
                        return;
                    }

                    if (mapViewRef && mapViewRef.current && mapViewRef.current._leaflet_id)
                        return;

                    const map = L.map(containerRef.current, {
                        zoomControl: true,
                        attributionControl: true
                    }).setView([37.5665, 126.9780], 12);

                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);

                    if (mapViewRef)
                        mapViewRef.current = map;

                    return function () {
                        try {
                            if (mapViewRef && mapViewRef.current === map)
                                mapViewRef.current = null;

                            map.remove();
                        } catch (e) {}
                    };
                }, []);

                // handle show/hide toggles
                React.useEffect(() => {
                    // when becoming visible, leaflet needs a resize recalculation
                    const map = mapViewRef ? mapViewRef.current : null;
                    if (!map || !map.invalidateSize)
                        return;

                    // toggle the display style attribute
                    containerRef.current.style.display = (visible ? "block" : "none");

                    // defer until after layout/display change
                    if (visible) {
                        setTimeout(function () {
                            try {
                                map.invalidateSize();
                                
                                navigator.geolocation.getCurrentPosition(pos => {
                                    mark(pos.coords.latitude, pos.coords.longitude, `My Location: (${pos.coords.latitude}, ${pos.coords.longitude})`);
                                });
                            } catch (e) {}
                        }, 0);
                    }
                }, [visible]);

                return _e('div', { id: 'mapView', ref: containerRef });
            }

            function App() {
                const editorRef = React.useRef(null);
                const promptListenersRef = React.useRef([]);
                const fileNameRef = React.useRef('hello.js');
                const promptMessagesRef = React.useRef([]);
                const mapViewRef = React.useRef(null);
                const coordinateMarkersRef = React.useRef([]);
                const [showMap, setShowMap] = React.useState(false);

                // The panes are sized by the flex layout; Monaco only needs to re-measure.
                const resizeEditor = () => {
                    if (editorRef.current) editorRef.current.layout();
                };

                // Sends the prompt messages to the open prompt editor windows (prompt.html),
                // except the window the change came from. Closed windows are dropped.
                const notifyPromptMessages = (source) => {
                    const json = JSON.stringify(promptMessagesRef.current);
                    promptListenersRef.current = promptListenersRef.current.filter(listener => {
                        try {
                            if (!listener.win || listener.win.closed)
                                return false;
                            if (listener.win !== source)
                                listener.callback(json);
                            return true;
                        } catch (e) {
                            return false;
                        }
                    });
                };

                // Lets the prompt editor window read and edit the prompt messages. Data is
                // exchanged as JSON text so that no objects are shared between windows.
                window.welsonJSPrompt = {
                    getJSON: () => JSON.stringify(promptMessagesRef.current),
                    setJSON: (json, source) => {
                        promptMessagesRef.current = JSON.parse(json);
                        notifyPromptMessages(source);
                    },
                    subscribe: (win, callback) => {
                        const listener = { win: win, callback: callback };
                        promptListenersRef.current.push(listener);
                        return () => {
                            promptListenersRef.current = promptListenersRef.current.filter(x => x !== listener);
                        };
                    }
                };

                const pushPromptMessage = (role, content) => {
                    promptMessagesRef.current.push({
                        role: role,
                        content: content
                    });
                    notifyPromptMessages(null);
                };

                const openPromptEditor = () => {
                    // Reuses (and focuses) the window if it is already open.
                    const promptWindow = window.open('/prompt.html', 'WelsonJSPromptEditor', 'width=900,height=700,resizable=yes,scrollbars=no');
                    if (!promptWindow) {
                        appendTextToEditor('\n// Prompt editor window was blocked by the browser. Please allow popups for localhost.');
                        return;
                    }
                    promptWindow.focus();
                };

                const navigate = (href) => {
                    const a = document.createElement("a");
                    a.href = href;
                    a.target = "_blank";
                    document.body.appendChild(a);
                    a.click();
                };

                const appendTextToEditor = (text) => {
                    const editor = editorRef.current;
                    const position = editor.getPosition() || { lineNumber: 1, column: 1 };
                    const range = new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column);
                    editor.executeEdits('', [{
                        range: range,
                        text: "\n" + text,
                        forceMoveMarkers: true
                    }]);
                    resizeEditor();
                };

                const insertExample = (fileName, source) => {
                    const editor = editorRef.current;
                    if (!editor)
                        return;

                    const position = editor.getPosition();
                    const range = new monaco.Range(
                        position.lineNumber,
                        position.column,
                        position.lineNumber,
                        position.column
                    );
                    editor.executeEdits('insert-example', [{
                        range: range,
                        text: '\n\n' + source + '\n',
                        forceMoveMarkers: true
                    }]);
                    fileNameRef.current = fileName;
                };

                const showExcelExample = () => insertExample('excel-example.js', [
                    '// Excel automation example',
                    'var Office = require("lib/msoffice");',
                    '',
                    'function main() {',
                    '    var excel = new Office.Excel();',
                    '    excel.open();',
                    '    excel.getCellByPosition(1, 1).setValue("Hello from WelsonJS");',
                    '}',
                    '',
                    'exports.main = main;'
                ].join('\n'));

                const showPowerPointExample = () => insertExample('powerpoint-example.js', [
                    '// PowerPoint automation example',
                    'var Office = require("lib/msoffice");',
                    '',
                    'function main() {',
                    '    var powerpoint = new Office.PowerPoint();',
                    '    powerpoint.open();',
                    '    var slide = powerpoint.addSlide();',
                    '    slide.setTitle("Hello from WelsonJS");',
                    '}',
                    '',
                    'exports.main = main;'
                ].join('\n'));

                const showWordExample = () => insertExample('word-example.js', [
                    '// Word automation example',
                    'var Office = require("lib/msoffice");',
                    '',
                    'function main() {',
                    '    var word = new Office.Word();',
                    '    word.open();',
                    '    word.setText("Hello from WelsonJS");',
                    '}',
                    '',
                    'exports.main = main;'
                ].join('\n'));

                const showHwpExample = () => insertExample('hwp-example.js', [
                    '// Hancom Hangul (HWP) automation example',
                    'var HWP = require("lib/hwp");',
                    '',
                    'function main() {',
                    '    var hwp = HWP.create({ visible: true });',
                    '    hwp.getInstance();',
                    '    hwp.insertText("WelsonJS 한글 문서 예제");',
                    '}',
                    '',
                    'exports.main = main;'
                ].join('\n'));

                const showWorldTouristExample = () => {
                    insertExample('world-tourist-coordinates.js', [
                        '// Major tourist destinations in Korea and around the world',
                        'var places = [',
                        '    { name: "Gyeongbokgung Palace", coordinate: [37.5796, 126.9770] },',
                        '    { name: "N Seoul Tower", coordinate: [37.5512, 126.9882] },',
                        '    { name: "Eiffel Tower", coordinate: [48.8584, 2.2945] },',
                        '    { name: "Statue of Liberty", coordinate: [40.6892, -74.0445] },',
                        '    { name: "Big Ben", coordinate: [51.5007, -0.1246] },',
                        '    { name: "Taj Mahal", coordinate: [27.1751, 78.0421] },',
                        '    { name: "Sydney Opera House", coordinate: [-33.8568, 151.2153] },',
                        '    { name: "Colosseum", coordinate: [41.8902, 12.4922] },',
                        '    { name: "Machu Picchu", coordinate: [-13.1631, -72.5450] },',
                        '    { name: "Great Wall of China", coordinate: [40.4319, 116.5704] }',
                        '];',
                        '',
                        'function main() {',
                        '    console.log("World tourist destination coordinates loaded:", places.length);',
                        '}',
                        '',
                        'exports.main = main;'
                    ].join('\n'));
                };

                const runScript = () => {
                    const script = editorRef.current ? editorRef.current.getValue() : '';
                    if (!script.trim()) {
                        appendTextToEditor('\n// Script is empty.');
                        return;
                    }
                    // Open the window inside the click handler so popup blockers allow it,
                    // then attach it to the interactive session once the instance starts.
                    const terminalWindow = openTerminalWindow('wait=1');
                    axios.post('/jsrt-instance/run', { script: script })
                        .then(response => {
                            if (terminalWindow && response.data && response.data.sessionId) {
                                terminalWindow.location.href = '/terminal.html?session=' + encodeURIComponent(response.data.sessionId);
                            }
                        })
                        .catch(error => appendTextToEditor('\n// Script execution failed: ' + (error.message || error)));
                };

                const openTerminalWindow = (query) => {
                    const terminalWindow = window.open('/terminal.html' + (query ? '?' + query : ''), 'JsrtInstanceTerminal', 'width=1100,height=720,resizable=yes,scrollbars=no');
                    if (!terminalWindow) {
                        appendTextToEditor('\n// Terminal window was blocked by the browser. Please allow popups for localhost.');
                    }
                    return terminalWindow;
                };

                const openTerminal = () => openTerminalWindow('');

                // Lets the terminal window deploy the current editor content into each new instance.
                window.getWelsonJSEditorScript = () => editorRef.current ? editorRef.current.getValue() : '';

                const openFile = () => {
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.onchange = () => {
                        const file = fileInput.files[0];

                        if (!file)
                            return;

                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const fileName = file.name;
                            const ext = fileName.split('.').pop().toLowerCase();
                            const langMap = {
                                js: 'javascript', ts: 'typescript', html: 'html',
                                css: 'css', json: 'json', py: 'python', java: 'java',
                                c: 'c', cpp: 'cpp', cs: 'csharp', php: 'php',
                                rb: 'ruby', go: 'go', rs: 'rust'
                            };
                            const lang = langMap[ext] || 'plaintext';

                            monaco.editor.setModelLanguage(editorRef.current.getModel(), lang);
                            editorRef.current.setValue(e.target.result);

                            fileNameRef.current = fileName;
                        };
                        reader.readAsText(file);
                    };
                    fileInput.click();
                };

                const saveFile = () => {
                    const text = editorRef.current.getValue();
                    const fileName = prompt("Enter file name:", fileNameRef.current);

                    if (!fileName)
                        return;

                    const blob = new Blob([text], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = fileNameRef.current;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                // Inserts a one-line status comment below lineNumber and returns a function
                // that later replaces that line. The line is tracked with a decoration, so
                // the result lands in the right place even if the user keeps editing while
                // the model is generating.
                const insertPlaceholder = (lineNumber, text) => {
                    const editor = editorRef.current;
                    const model = editor.getModel();
                    lineNumber = Math.min(Math.max(lineNumber, 1), model.getLineCount());

                    const column = model.getLineMaxColumn(lineNumber);
                    editor.executeEdits('llamacpp', [{
                        range: new monaco.Range(lineNumber, column, lineNumber, column),
                        text: '\n' + text,
                        forceMoveMarkers: true
                    }]);

                    const line = lineNumber + 1;
                    const ids = model.deltaDecorations([], [{
                        range: new monaco.Range(line, 1, line, model.getLineMaxColumn(line)),
                        options: { stickiness: monaco.editor.TrackedRangeStickiness.NeverGrowsWhenTypingAtEdges }
                    }]);

                    return (replacement) => {
                        const range = model.isDisposed() ? null : model.getDecorationRange(ids[0]);
                        if (!model.isDisposed()) model.deltaDecorations(ids, []);

                        if (!range || editorRef.current.getModel() !== model) {
                            // The content was replaced (for example, a file was opened) while
                            // waiting. Do not change the new content; the answer is kept in
                            // the prompt messages (Prompt window).
                            console.info('llama.cpp answer not inserted because the editor content was replaced:', replacement);
                            return;
                        }

                        if (range.isEmpty()) {
                            // The status line was deleted; insert at the cursor instead.
                            appendTextToEditor(replacement);
                            return;
                        }

                        editorRef.current.executeEdits('llamacpp', [{ range: range, text: replacement, forceMoveMarkers: true }]);
                    };
                };

                // One line of the prompt for the status comment.
                const summarize = (text) => {
                    const firstLine = String(text).split(/\r?\n/).find(x => x.trim() !== '') || '';
                    return firstLine.length > 80 ? firstLine.substring(0, 80) + '...' : firstLine;
                };

                // Generates text with the local llama.cpp model through the launcher
                // (/llamacpp/chat), which starts llama-server on the first request. The
                // answer replaces a status comment inserted below lineNumber.
                const askLlamaCpp = (promptMessage, lineNumber, summary) => {
                    const replace = insertPlaceholder(lineNumber,
                        `// ${summarize(summary)}... Generating text with llama.cpp (the first request may take a while to load the model)...`);
                    pushPromptMessage("user", promptMessage);

                    const data = {
                        messages: promptMessagesRef.current,
                        max_tokens: 2048,
                        temperature: 0.8,
                        top_p: 0.1,
                        presence_penalty: 0,
                        frequency_penalty: 0,
                        // For reasoning models (for example, FrogNano): without this they spend
                        // the token budget on reasoning_content (minutes on a CPU) before
                        // writing the answer. Templates without the option ignore it.
                        chat_template_kwargs: { enable_thinking: false }
                    };

                    axios.post('/llamacpp/chat', data, {
                        headers: { 'Content-Type': 'application/json' }
                    }).then(response => {
                        const choices = (response.data && response.data.choices) || [];
                        if (choices.length === 0) {
                            replace('// llama.cpp returned no response.');
                            return;
                        }

                        const blocks = choices.map(x => {
                            const message = x.message || {};
                            let responseContent = message.content || '';
                            let note = '';
                            if (!responseContent && message.reasoning_content) {
                                // The model ran out of tokens while reasoning.
                                note = `// llama.cpp returned only reasoning (finish_reason: ${x.finish_reason}).\n`;
                                responseContent = message.reasoning_content;
                            }
                            pushPromptMessage("assistant", responseContent);

                            // Keep the text inside the comment block.
                            const responseText = DOMPurify.sanitize(responseContent, { ALLOWED_TAGS: [], ALLOWED_ATTR: [] }).replace(/\*\//g, '* /');
                            return `${note}/*\n${responseText}\n*/`;
                        });
                        replace(blocks.join('\n'));
                    }).catch(error => {
                        // Launcher errors are {error: "..."}; llama-server errors are {error: {message}}.
                        const body = error.response && error.response.data;
                        const detail = body && body.error
                            ? (typeof body.error === 'string' ? body.error : (body.error.message || JSON.stringify(body.error)))
                            : error.message;
                        console.error('Error:', body || error.message);
                        replace(`// llama.cpp request failed: ${detail}`);
                    });
                };

                // Ribbon button: asks for a prompt; the answer goes below the cursor line.
                const sendMessageToLlamaCpp = () => {
                    const promptMessage = prompt("Enter a prompt message:", '');
                    if (!promptMessage || promptMessage.trim() == '') {
                        alert("A prompt message is required.");
                        return;
                    }

                    const editor = editorRef.current;
                    if (!editor)
                        return;

                    const position = editor.getPosition() || { lineNumber: 1 };
                    askLlamaCpp(promptMessage, position.lineNumber, promptMessage);
                };

                // Editor context menu: send the selected text to llama.cpp. The answer goes
                // below the selection.
                const registerLlamaCppActions = (editor) => {
                    const getSelection = () => {
                        const selection = editor.getSelection();
                        if (!selection || selection.isEmpty())
                            return null;

                        const model = editor.getModel();
                        // A selection of whole lines ends at column 1 of the next line.
                        const endLine = (selection.endColumn === 1 && selection.endLineNumber > selection.startLineNumber)
                            ? selection.endLineNumber - 1
                            : selection.endLineNumber;
                        return { text: model.getValueInRange(selection), endLine: endLine, language: model.getLanguageId() };
                    };

                    const fence = (selection) => '```' + selection.language + '\n' + selection.text + '\n```';

                    const actions = [
                        {
                            id: 'welsonjs.llamacpp.sendSelection',
                            label: 'llama.cpp: Send Selection',
                            build: selection => ({ message: selection.text, summary: selection.text })
                        },
                        {
                            id: 'welsonjs.llamacpp.explainSelection',
                            label: 'llama.cpp: Explain Selection',
                            build: selection => ({
                                message: 'Explain what the following code does.\n\n' + fence(selection),
                                summary: 'Explain the selection'
                            })
                        },
                        {
                            id: 'welsonjs.llamacpp.askAboutSelection',
                            label: 'llama.cpp: Ask About Selection...',
                            build: selection => {
                                const question = prompt("Ask llama.cpp about the selection:", '');
                                if (!question || question.trim() === '')
                                    return null;
                                return { message: question + '\n\n' + fence(selection), summary: question };
                            }
                        }
                    ];

                    actions.forEach((action, index) => {
                        editor.addAction({
                            id: action.id,
                            label: action.label,
                            precondition: 'editorHasSelection',
                            contextMenuGroupId: '1_llamacpp',
                            contextMenuOrder: index + 1,
                            run: () => {
                                const selection = getSelection();
                                if (!selection)
                                    return;

                                const request = action.build(selection);
                                if (request)
                                    askLlamaCpp(request.message, selection.endLine, request.summary);
                            }
                        });
                    });
                };

                const savePromptMessages = () => {
                    const text = JSON.stringify(promptMessagesRef.current, null, 4);
                    const blob = new Blob([text], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = "prompt.json";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                const loadPromptMessages = () => {
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = '.json';
                    fileInput.onchange = function (event) {
                        const file = event.target.files[0];

                        if (!file)
                            return;

                        let reader = new FileReader();
                        reader.onload = function (e) {
                            promptMessagesRef.current = JSON.parse(e.target.result);
                            notifyPromptMessages(null);
                            appendTextToEditor("\n//Prompt loaded successfully.");
                        };
                        reader.readAsText(file);
                    };
                    fileInput.click();
                };

                const queryWhois = () => {
                    const hostname = prompt("Enter a hostname or IP address:", '');
                    if (!hostname || hostname.trim() == '') {
                        appendTextToEditor("\n// A hostname or IP address is required.");
                        return;
                    }

                    axios.get(`/whois/${hostname}`).then(response => {
                        const responseText = DOMPurify.sanitize(response.data, { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
                        appendTextToEditor(`/*\nHostname:${hostname}\n\n${responseText}\n*/`);
                        pushPromptMessage("system", responseText);
                    }).catch(error => {
                        console.error(error);
                    });
                };

                const queryDns = () => {
                    const hostname = prompt("Enter a hostname or IP address:", '');
                    if (!hostname || hostname.trim() == '') {
                        appendTextToEditor("\n// A hostname or IP address is required.");
                        return;
                    }

                    axios.get(`/dns-query/${hostname}`).then(response => {
                        const responseText = response.data;
                        appendTextToEditor(`/*\nHostname:${hostname}\n\n${responseText}\n*/`);
                        pushPromptMessage("system", responseText);
                    }).catch(error => {
                        console.error(error);
                    });
                };

                const queryIp = () => {
                    const hostname = prompt("Enter IP address:", '');
                    if (!hostname || hostname.trim() === '') {
                        appendTextToEditor("\n// IP address is required.");
                        return;
                    }
                    const ip = encodeURIComponent(hostname.trim());

                    axios.get(`/ip-query/${hostname}`).then(res => {
                        if (!res || !res.data) {
                            appendTextToEditor("\n// No data returned from server.");
                            return;
                        }

                        // Parse XML and keep attributes (provider, status)
                        const parser = new XMLParser({ ignoreAttributes: false, attributeNamePrefix: "@_" });
                        const parsed = parser.parse(res.data);

                        // Expected XML:
                        // <result target="...">
                        //   <response provider="criminalip" status="200">
                        //     <text>{ "...raw json..." }</text>
                        //   </response>
                        //   <response provider="abuseipdb" status="200">
                        //     <text>{ "...raw json..." }</text>
                        //   </response>
                        // </result>

                        // Normalize to an array of <response> nodes
                        const responsesNode = parsed?.result?.response;
                        const responses = Array.isArray(responsesNode)
                            ? responsesNode
                            : (responsesNode ? [responsesNode] : []);

                        if (responses.length === 0) {
                            appendTextToEditor("\n// No <response> nodes found.");
                            return;
                        }

                        // Extract each <response><text> content and print
                        let out = "\n// --- IP Query Results ---";
                        for (const r of responses) {
                            const provider = r?.["@_provider"] || "unknown";
                            const status = r?.["@_status"] || "n/a";

                            // Fast-XML-Parser usually makes <text> a string, but be safe:
                            let txt = r?.text;
                            if (txt && typeof txt === "object") {
                                // If parser produced an object with a '#text' key or similar
                                txt = txt["#text"] || JSON.stringify(txt);
                            }
                            if (txt == null) txt = "";

                            out += `\n// provider=${provider}, status=${status}\n${txt}\n`;
                        }
                        out = "\n/*" + out + "*/\n";

                        appendTextToEditor(out);
                        pushPromptMessage("system", out);
                    }).catch(error => {
                        console.error(error);
                        appendTextToEditor(`\n// Failed to query the IP: ${error.message}`);
                    });
                };
                
                const extractCoordinates = (source) => {
                    const coordinates = [];
                    const seen = {};
                    const pattern = /(-?\d{1,3}(?:\.\d+)?)\s*[,;]\s*(-?\d{1,3}(?:\.\d+)?)/g;
                    let match;

                    while ((match = pattern.exec(source || '')) !== null) {
                        const latitude = Number(match[1]);
                        const longitude = Number(match[2]);
                        if (latitude < -90 || latitude > 90 || longitude < -180 || longitude > 180)
                            continue;

                        const key = latitude + ',' + longitude;
                        if (!seen[key]) {
                            seen[key] = true;
                            coordinates.push({ latitude: latitude, longitude: longitude });
                        }
                    }

                    return coordinates;
                };

                const plotEditorCoordinates = () => {
                    const map = mapViewRef.current;
                    if (!map || typeof L === 'undefined')
                        return;

                    coordinateMarkersRef.current.forEach(marker => map.removeLayer(marker));
                    coordinateMarkersRef.current = [];

                    const coordinates = extractCoordinates(editorRef.current ? editorRef.current.getValue() : '');
                    const bounds = [];
                    coordinates.forEach(coordinate => {
                        const latlng = [coordinate.latitude, coordinate.longitude];
                        const marker = L.marker(latlng)
                            .addTo(map)
                            .bindPopup('Coordinate: ' + coordinate.latitude + ', ' + coordinate.longitude);
                        coordinateMarkersRef.current.push(marker);
                        bounds.push(latlng);
                    });

                    if (bounds.length === 1)
                        map.setView(bounds[0], 14);
                    else if (bounds.length > 1)
                        map.fitBounds(bounds, { padding: [30, 30] });
                };

                function toggleMap() {
                    const nextVisible = !showMap;
                    setShowMap(nextVisible);
                    if (nextVisible)
                        setTimeout(plotEditorCoordinates, 100);
                }

                const openDiscord = () => navigate('https://discord.gg/XKG5CjtXEj?utm_source=welsonjs');
                const openKakao = () => navigate('https://pf.kakao.com/_mNxisj');

                React.useEffect(() => {
                    window.addEventListener('resize', () => {
                        resizeEditor();
                    });
                    window.dispatchEvent(new Event('resize'));
                }, []);

                React.useEffect(() => {
                }, []);

                return _e('div', { className: 'app' },
                    _e(RibbonMenu, {
                        onOpenFileClick: openFile,
                        onSaveFileClick: saveFile,
                        onLlamaCppClick: sendMessageToLlamaCpp,
                        onPromptEditorClick: openPromptEditor,
                        onSavePromptClick: savePromptMessages,
                        onLoadPromptClick: loadPromptMessages,
                        onQueryWhoisClick: queryWhois,
                        onQueryDnsClick: queryDns,
                        onQueryIpClick: queryIp,
                        onMapClick: toggleMap,
                        onRunScriptClick: runScript,
                        onTerminalClick: openTerminal,
                        onExcelExampleClick: showExcelExample,
                        onPowerPointExampleClick: showPowerPointExample,
                        onWordExampleClick: showWordExample,
                        onHwpExampleClick: showHwpExample,
                        onDiscordClick: openDiscord,
                        onKakaoClick: openKakao,
                        onWorldTouristExampleClick: showWorldTouristExample,
                    }),
                    _e('div', { id: 'container' },
                        _e(Editor, { editorRef: editorRef, visible: !showMap, onReady: registerLlamaCppActions }),
                        _e(MapView, { mapViewRef: mapViewRef, visible: showMap })
                    ),
                    _e('div', { className: 'banner' }, _e('a', { href: 'https://github.com/gnh1201/welsonjs' }, '❤️ Contribute this project')),
                );
            }

            const container = document.getElementById('app');
            const root = ReactDOM.createRoot(container);
            root.render(_e(App));
        });
    </script>
</body>
