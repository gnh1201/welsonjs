<!DOCTYPE html>
<html>
<head>
    <title>WelsonJS Editor</title>
    <meta name="title" content="WelsonJS Editor">
    <meta name="description" content="WelsonJS can build a Windows app on the Windows built-in JavaScript engine.">
    <meta name="keywords" content="ecmascript, javascript, windows">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
    <meta name="author" content="2025 Catswords OSS and WelsonJS Contributors (GPL-3.0-or-later)">
    <style>
        html, body, #app, #app > .app {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Ribbon, editor area and banner stack vertically; the editor area takes the rest. */
        #app > .app {
            display: flex;
            flex-direction: column;
        }

        #container {
            border: 1px solid grey;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            overflow: hidden;
        }

        /* min-width/min-height: 0 let the panes shrink below their content size when the
           window gets smaller. The prompt messages editor opens in its own window
           (prompt.html). */
        #editor, #mapView {
            min-width: 0;
            min-height: 0;
        }

        #editor {
            flex: 1;
        }

        #mapView {
            flex: 1;
        }

        .banner {
            padding: 10px;
            background-color: #f1f1f1;
            font-size: 14px;
        }

        .banner a {
            text-decoration: none;
            color: #000;
        }

        .banner a:hover {
            text-decoration: none;
            font-weight: bold;
            color: inherit; /* keeps contrast consistent */
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        var require = {
            paths: {
                vs: 'http://localhost:3000/ajax/libs/monaco-editor/0.52.2/min/vs'
            }
        };
    </script>
    <script src="http://localhost:3000/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/axios/1.8.4/axios.min.js" integrity="sha384-06w+raHvkSL3+E7mbQ2X6DZwI5A3veU8Ba+NLrAPxxRGw4Xy78sihHDHQMustMM4" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/fast-xml-parser/4.5.1/fxparser.min.js" integrity="sha384-ae/HepOQ8hiJ/VA6yGwPMGXQXOkT/lJpjlcQ7EUgibUcfnBltuozgNj4IgOZ9QLc" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/dompurify/3.2.4/purify.min.js" integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/monaco-editor/0.52.2/min/vs/loader.js" integrity="sha384-pHG02SG8pId94Np3AbPmBEJ1yPqaH0IkJGLSNGXYmuGhkazT8Lr/57WYpbkGjJtu" crossorigin="anonymous"></script>
    <script src="http://localhost:3000/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.js" integrity="sha384-fj9z+NUc93I3woCCy5IRQfrQ8Amu1E27tllwgb5gz3d9Vr1ymS13xcF6two3e4KH" crossorigin="anonymous"></script>
    <script>
        function loadResource(url, mimeType, integrity) {
            mimeType = mimeType || 'application/javascript';

            return new Promise((resolve, reject) => {
                let el;

                if (mimeType === 'text/css') {
                    el = document.createElement('link');
                    el.rel = 'stylesheet';
                    el.type = mimeType;
                    el.href = url;
                } else {
                    el = document.createElement('script');
                    el.type = mimeType;
                    el.src = url;
                }

                if (integrity) {
                    el.integrity = integrity;
                    el.crossOrigin = 'anonymous';
                }

                el.onload = resolve;
                el.onerror = reject;

                (mimeType === 'text/css' ? document.head : document.body).appendChild(el);
            });
        }

        Promise.all([
            loadResource("http://localhost:3000/ajax/libs/metroui/dev/lib/metro.css", "text/css", "sha384-4XgOiXH2ZMaWt5s5B35yKi7EAOabhZvx7wO8Jr71q2vZ+uONdRza/6CsK2kpyocd"),
            loadResource("http://localhost:3000/ajax/libs/metroui/dev/lib/icons.css", "text/css", "sha384-FuLND994etg+RtnpPSPMyNBvL+fEz+xGhbN61WUWuDEeZ+wJzcQ8SGqAMuI5hWrt"),
            loadResource("http://localhost:3000/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.css", "text/css", "sha384-06yHXpYRlHEPaR4AS0fB/W+lMN09Zh5e1XMtfkNQdHV38OlhfkOEW5M+pCj3QskC"),
            loadResource("http://localhost:3000/ajax/libs/leaflet/1.9.4/leaflet.min.css", "text/css", "sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb")
        ]).then(() => {
            const _e = React.createElement;

            function Button({ id, icon, caption, onClick }) {
                return _e(
                    'button',
                    { id, className: 'ribbon-button', onClick },
                    _e('span', { className: `icon ${icon}` }),
                    _e('span', { className: 'caption' }, caption)
                );
            }

            function Group({ title, buttons }) {
                return _e(
                    'div',
                    { className: 'group' },
                    buttons.map((btn, index) =>
                        _e(Button, { key: index, ...btn })
                    ),
                    _e('span', { className: 'title' }, title)
                );
            }

            function RibbonMenu({
                webChatName, onWebChatToggleClick,
                onOpenFileClick, onSaveFileClick, onPromptEditorClick,
                onSavePromptClick, onLoadPromptClick, onQueryWhoisClick, onQueryDnsClick,
                onQueryIpClick, onMapClick, onRunScriptClick, onTerminalClick,
                onExcelExampleClick, onPowerPointExampleClick, onWordExampleClick, onHwpExampleClick,
                onDiscordClick, onKakaoClick, onWorldTouristExampleClick
            }) {
                const fileButtons = [
                    {
                        id: 'btnOpenFile',
                        icon: 'mif-folder-open',
                        caption: 'Open File',
                        onClick: onOpenFileClick
                    },
                    {
                        id: 'btnSaveFile',
                        icon: 'mif-floppy-disks',
                        caption: 'Save File',
                        onClick: onSaveFileClick
                    },
                    {
                        id: 'btnRunScript',
                        icon: 'mif-play',
                        caption: 'Run File',
                        onClick: onRunScriptClick
                    },
                    {
                        id: 'btnTerminal',
                        icon: 'mif-prompt',
                        caption: 'Terminal',
                        onClick: onTerminalClick
                    }
                ];

                const inferenceButtons = [
                    { id: 'btnPromptEditor', icon: 'mif-pencil', caption: 'Prompt', onClick: onPromptEditorClick },
                    { id: 'btnSavePrompt', icon: 'mif-floppy-disks', caption: 'Save', onClick: onSavePromptClick },
                    { id: 'btnLoadPrompt', icon: 'mif-file-upload', caption: 'Load', onClick: onLoadPromptClick },
                    // Switches the web chat service that the editor's context menu sends to.
                    { id: 'btnWebChat', icon: 'mif-loop2', caption: webChatName, onClick: onWebChatToggleClick }
                ];

                const networkToolsButtons = [
                    { id: 'btnWhois', icon: 'mif-earth', caption: 'Whois', onClick: onQueryWhoisClick },
                    { id: 'btnQueryDns', icon: 'mif-earth', caption: 'DNS', onClick: onQueryDnsClick },
                    { id: 'btnQueryIp', icon: 'mif-user-secret', caption: 'IP', onClick: onQueryIpClick },
                    { id: 'btnMap', icon: 'mif-rocket', caption: 'Map', onClick: onMapClick }
                ];

                const examplesButtons = [
                    { id: 'btnExcelExample', icon: 'mif-file-text', caption: 'Excel', onClick: onExcelExampleClick },
                    { id: 'btnPowerPointExample', icon: 'mif-file-text', caption: 'PowerPoint', onClick: onPowerPointExampleClick },
                    { id: 'btnWordExample', icon: 'mif-file-text', caption: 'Word', onClick: onWordExampleClick },
                    { id: 'btnHwpExample', icon: 'mif-file-text', caption: 'HWP', onClick: onHwpExampleClick },
                    { id: 'btnWorldTouristExample', icon: 'mif-map2', caption: 'Places', onClick: onWorldTouristExampleClick }
                ];

                const communityButtons = [
                    { id: 'btnDiscord', icon: 'mif-earth', caption: 'Discord', onClick: onDiscordClick },
                    { id: 'btnKakao', icon: 'mif-earth', caption: 'Kakao+', onClick: onKakaoClick }
                ];

                return _e(
                    'nav',
                    { 'className': 'ribbon-menu' },
                    _e('ul', { className: 'tabs-holder' },
                        _e('li', { className: 'static' }, _e('a', { href: '#heading-tab' }, 'WelsonJS')),
                        _e('li', { className: 'active' }, _e('a', { href: '#editor-tab' }, 'Editor'))
                    ),
                    _e('div', { className: 'content-holder' },
                        _e('div', { className: 'section active', id: 'editor-tab' },
                            _e(Group, { title: 'File', buttons: fileButtons }),
                            _e(Group, { title: 'Inference (AI)', buttons: inferenceButtons }),
                            _e(Group, { title: 'Network Tools', buttons: networkToolsButtons }),
                            _e(Group, { title: 'Office Automation', buttons: examplesButtons }),
                            _e(Group, { title: 'Community', buttons: communityButtons })
                        )
                    )
                );
            }

            function Editor({ editorRef, visible, onReady }) {
                const containerRef = React.useRef(null);

                const getSuggestions = (word, range) => axios.get(`/completion/${encodeURIComponent(word)}`)
                    .then(response => {
                        const parser = new XMLParser();
                        const result = parser.parse(response.data);

                        const suggestions = ((item) => Array.isArray(item) ? item : [item])(result.suggestions.item).map((item) => {
                            return {
                                label: item.label,
                                kind: monaco.languages.CompletionItemKind.Text,
                                documentation: item.documentation || "",
                                insertText: '"' + item.insertText + '"',
                                range: range
                            };
                        });

                        return {
                            suggestions: suggestions
                        };
                    })
                    .catch(function () {
                        return {
                            suggestions: []
                        };
                    });

                React.useEffect(() => {
                    if (!containerRef.current)
                        return;

                    require(['vs/editor/editor.main'], () => {
                        const defaultValue = ['// hello.js', 'function main() {', '    console.log("Hello World");', '}', '', 'exports.main = main;', '', 'exports.VERSIONINFO = "Hello World (hello.js) version 0.1";', 'exports.AUTHOR = "oss@catswords.re.kr";', 'exports.global = global;', 'exports.require = global.require;'].join('\n');
                        let initialValue = defaultValue;

                        try {
                            const savedValue = localStorage.getItem('welsonjs.editor.source');
                            if (savedValue !== null)
                                initialValue = savedValue;
                        } catch (e) {}

                        const instance = monaco.editor.create(containerRef.current, {
                            value: initialValue,
                            language: 'javascript',
                            // re-layout whenever the container size changes (window resize, map toggle)
                            automaticLayout: true
                        });

                        instance.onDidChangeModelContent(() => {
                            try {
                                localStorage.setItem('welsonjs.editor.source', instance.getValue());
                            } catch (e) {}
                        });

                        monaco.languages.registerCompletionItemProvider('javascript', {
                            provideCompletionItems: function (model, position) {
                                const word = model.getWordUntilPosition(position);
                                const range = {
                                    startLineNumber: position.lineNumber,
                                    endLineNumber: position.lineNumber,
                                    startColumn: word.startColumn,
                                    endColumn: word.endColumn
                                };

                                return getSuggestions(word.word, range);
                            }
                        });

                        editorRef.current = instance;
                        if (onReady) onReady(instance);
                    });
                }, []);
                
                React.useEffect(() => {
                    // toggle the display style attribute
                    containerRef.current.style.display = (visible ? "" : "none");
                }, [visible]);

                return _e('div', { id: 'editor', ref: containerRef });
            }

            function useLocationMarker(mapViewRef) {
                const markerRef = React.useRef(null);

                const mark = React.useCallback((lat, lng, description) => {
                    const map = mapViewRef.current;
                    if (!map) return;

                    const latlng = L.latLng(lat, lng);

                    if (!markerRef.current) {
                        markerRef.current = L.marker(latlng).addTo(map)
                            .bindPopup(description || "(no description)")
                            .openPopup();
                    } else {
                        markerRef.current.setLatLng(latlng);
                    }
                }, [mapViewRef]);

                return { mark, markerRef };
            }
            
            function MapView({ mapViewRef, visible }) {
                const containerRef = React.useRef(null);
                
                const { mark } = useLocationMarker(mapViewRef);

                // init once
                React.useEffect(() => {
                    if (!containerRef.current)
                        return;

                    if (typeof L === "undefined" || !L || !L.map) {
                        console.error("[MapView] Leaflet (L) is not loaded.");
                        return;
                    }

                    if (mapViewRef && mapViewRef.current && mapViewRef.current._leaflet_id)
                        return;

                    const map = L.map(containerRef.current, {
                        zoomControl: true,
                        attributionControl: true
                    }).setView([37.5665, 126.9780], 12);

                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);

                    if (mapViewRef)
                        mapViewRef.current = map;

                    return function () {
                        try {
                            if (mapViewRef && mapViewRef.current === map)
                                mapViewRef.current = null;

                            map.remove();
                        } catch (e) {}
                    };
                }, []);

                // handle show/hide toggles
                React.useEffect(() => {
                    // when becoming visible, leaflet needs a resize recalculation
                    const map = mapViewRef ? mapViewRef.current : null;
                    if (!map || !map.invalidateSize)
                        return;

                    // toggle the display style attribute
                    containerRef.current.style.display = (visible ? "block" : "none");

                    // defer until after layout/display change
                    if (visible) {
                        setTimeout(function () {
                            try {
                                map.invalidateSize();
                                
                                navigator.geolocation.getCurrentPosition(pos => {
                                    mark(pos.coords.latitude, pos.coords.longitude, `My Location: (${pos.coords.latitude}, ${pos.coords.longitude})`);
                                });
                            } catch (e) {}
                        }, 0);
                    }
                }, [visible]);

                return _e('div', { id: 'mapView', ref: containerRef });
            }

            function App() {
                const editorRef = React.useRef(null);
                const promptListenersRef = React.useRef([]);
                const fileNameRef = React.useRef('hello.js');
                const promptMessagesRef = React.useRef([]);
                const mapViewRef = React.useRef(null);
                const coordinateMarkersRef = React.useRef([]);
                const [showMap, setShowMap] = React.useState(false);

                // The panes are sized by the flex layout; Monaco only needs to re-measure.
                const resizeEditor = () => {
                    if (editorRef.current) editorRef.current.layout();
                };

                // Sends the prompt messages to the open prompt editor windows (prompt.html),
                // except the window the change came from. Closed windows are dropped.
                const notifyPromptMessages = (source) => {
                    const json = JSON.stringify(promptMessagesRef.current);
                    promptListenersRef.current = promptListenersRef.current.filter(listener => {
                        try {
                            if (!listener.win || listener.win.closed)
                                return false;
                            if (listener.win !== source)
                                listener.callback(json);
                            return true;
                        } catch (e) {
                            return false;
                        }
                    });
                };

                // Lets the prompt editor window read and edit the prompt messages. Data is
                // exchanged as JSON text so that no objects are shared between windows.
                window.welsonJSPrompt = {
                    getJSON: () => JSON.stringify(promptMessagesRef.current),
                    setJSON: (json, source) => {
                        promptMessagesRef.current = JSON.parse(json);
                        notifyPromptMessages(source);
                    },
                    subscribe: (win, callback) => {
                        const listener = { win: win, callback: callback };
                        promptListenersRef.current.push(listener);
                        return () => {
                            promptListenersRef.current = promptListenersRef.current.filter(x => x !== listener);
                        };
                    }
                };

                const pushPromptMessage = (role, content) => {
                    promptMessagesRef.current.push({
                        role: role,
                        content: content
                    });
                    notifyPromptMessages(null);
                };

                const openPromptEditor = () => {
                    // Reuses (and focuses) the window if it is already open.
                    const promptWindow = window.open('/prompt.html', 'WelsonJSPromptEditor', 'width=900,height=700,resizable=yes,scrollbars=no');
                    if (!promptWindow) {
                        appendTextToEditor('\n// Prompt editor window was blocked by the browser. Please allow popups for localhost.');
                        return;
                    }
                    promptWindow.focus();
                };

                const navigate = (href) => {
                    const a = document.createElement("a");
                    a.href = href;
                    a.target = "_blank";
                    document.body.appendChild(a);
                    a.click();
                };

                const appendTextToEditor = (text) => {
                    const editor = editorRef.current;
                    const position = editor.getPosition() || { lineNumber: 1, column: 1 };
                    const range = new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column);
                    editor.executeEdits('', [{
                        range: range,
                        text: "\n" + text,
                        forceMoveMarkers: true
                    }]);
                    resizeEditor();
                };

                const insertExample = (fileName, source) => {
                    const editor = editorRef.current;
                    if (!editor)
                        return;

                    const position = editor.getPosition();
                    const range = new monaco.Range(
                        position.lineNumber,
                        position.column,
                        position.lineNumber,
                        position.column
                    );
                    editor.executeEdits('insert-example', [{
                        range: range,
                        text: '\n\n' + source + '\n',
                        forceMoveMarkers: true
                    }]);
                    fileNameRef.current = fileName;
                };

                const showExcelExample = () => insertExample('excel-example.js', [
                    '// Excel automation example',
                    'var Office = require("lib/msoffice");',
                    '',
                    'function main() {',
                    '    var excel = new Office.Excel();',
                    '    excel.open();',
                    '    excel.getCellByPosition(1, 1).setValue("Hello from WelsonJS");',
                    '}',
                    '',
                    'exports.main = main;'
                ].join('\n'));

                const showPowerPointExample = () => insertExample('powerpoint-example.js', [
                    '// PowerPoint automation example',
                    'var Office = require("lib/msoffice");',
                    '',
                    'function main() {',
                    '    var powerpoint = new Office.PowerPoint();',
                    '    powerpoint.open();',
                    '    var slide = powerpoint.addSlide();',
                    '    slide.setTitle("Hello from WelsonJS");',
                    '}',
                    '',
                    'exports.main = main;'
                ].join('\n'));

                const showWordExample = () => insertExample('word-example.js', [
                    '// Word automation example',
                    'var Office = require("lib/msoffice");',
                    '',
                    'function main() {',
                    '    var word = new Office.Word();',
                    '    word.open();',
                    '    word.setText("Hello from WelsonJS");',
                    '}',
                    '',
                    'exports.main = main;'
                ].join('\n'));

                const showHwpExample = () => insertExample('hwp-example.js', [
                    '// Hancom Hangul (HWP) automation example',
                    'var HWP = require("lib/hwp");',
                    '',
                    'function main() {',
                    '    var hwp = HWP.create({ visible: true });',
                    '    hwp.getInstance();',
                    '    hwp.insertText("WelsonJS 한글 문서 예제");',
                    '}',
                    '',
                    'exports.main = main;'
                ].join('\n'));

                const showWorldTouristExample = () => {
                    insertExample('world-tourist-coordinates.js', [
                        '// Major tourist destinations in Korea and around the world',
                        'var places = [',
                        '    { name: "Gyeongbokgung Palace", coordinate: [37.5796, 126.9770] },',
                        '    { name: "N Seoul Tower", coordinate: [37.5512, 126.9882] },',
                        '    { name: "Eiffel Tower", coordinate: [48.8584, 2.2945] },',
                        '    { name: "Statue of Liberty", coordinate: [40.6892, -74.0445] },',
                        '    { name: "Big Ben", coordinate: [51.5007, -0.1246] },',
                        '    { name: "Taj Mahal", coordinate: [27.1751, 78.0421] },',
                        '    { name: "Sydney Opera House", coordinate: [-33.8568, 151.2153] },',
                        '    { name: "Colosseum", coordinate: [41.8902, 12.4922] },',
                        '    { name: "Machu Picchu", coordinate: [-13.1631, -72.5450] },',
                        '    { name: "Great Wall of China", coordinate: [40.4319, 116.5704] }',
                        '];',
                        '',
                        'function main() {',
                        '    console.log("World tourist destination coordinates loaded:", places.length);',
                        '}',
                        '',
                        'exports.main = main;'
                    ].join('\n'));
                };

                const runScript = () => {
                    const script = editorRef.current ? editorRef.current.getValue() : '';
                    if (!script.trim()) {
                        appendTextToEditor('\n// Script is empty.');
                        return;
                    }
                    // Open the window inside the click handler so popup blockers allow it,
                    // then attach it to the interactive session once the instance starts.
                    const terminalWindow = openTerminalWindow('wait=1');
                    axios.post('/jsrt-instance/run', { script: script })
                        .then(response => {
                            if (terminalWindow && response.data && response.data.sessionId) {
                                terminalWindow.location.href = '/terminal.html?session=' + encodeURIComponent(response.data.sessionId);
                            }
                        })
                        .catch(error => appendTextToEditor('\n// Script execution failed: ' + (error.message || error)));
                };

                const openTerminalWindow = (query) => {
                    const terminalWindow = window.open('/terminal.html' + (query ? '?' + query : ''), 'JsrtInstanceTerminal', 'width=1100,height=720,resizable=yes,scrollbars=no');
                    if (!terminalWindow) {
                        appendTextToEditor('\n// Terminal window was blocked by the browser. Please allow popups for localhost.');
                    }
                    return terminalWindow;
                };

                const openTerminal = () => openTerminalWindow('');

                // Lets the terminal window deploy the current editor content into each new instance.
                window.getWelsonJSEditorScript = () => editorRef.current ? editorRef.current.getValue() : '';

                const openFile = () => {
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.onchange = () => {
                        const file = fileInput.files[0];

                        if (!file)
                            return;

                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const fileName = file.name;
                            const ext = fileName.split('.').pop().toLowerCase();
                            const langMap = {
                                js: 'javascript', ts: 'typescript', html: 'html',
                                css: 'css', json: 'json', py: 'python', java: 'java',
                                c: 'c', cpp: 'cpp', cs: 'csharp', php: 'php',
                                rb: 'ruby', go: 'go', rs: 'rust'
                            };
                            const lang = langMap[ext] || 'plaintext';

                            monaco.editor.setModelLanguage(editorRef.current.getModel(), lang);
                            editorRef.current.setValue(e.target.result);

                            fileNameRef.current = fileName;
                        };
                        reader.readAsText(file);
                    };
                    fileInput.click();
                };

                const saveFile = () => {
                    const text = editorRef.current.getValue();
                    const fileName = prompt("Enter file name:", fileNameRef.current);

                    if (!fileName)
                        return;

                    const blob = new Blob([text], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = fileNameRef.current;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                // Inserts a one-line status comment below lineNumber and returns a function
                // that later replaces that line. The line is tracked with a decoration, so
                // the result lands in the right place even if the user keeps editing while
                // the model is generating.
                const insertPlaceholder = (lineNumber, text) => {
                    const editor = editorRef.current;
                    const model = editor.getModel();
                    lineNumber = Math.min(Math.max(lineNumber, 1), model.getLineCount());

                    const column = model.getLineMaxColumn(lineNumber);
                    editor.executeEdits('llamacpp', [{
                        range: new monaco.Range(lineNumber, column, lineNumber, column),
                        text: '\n' + text,
                        forceMoveMarkers: true
                    }]);

                    const line = lineNumber + 1;
                    const ids = model.deltaDecorations([], [{
                        range: new monaco.Range(line, 1, line, model.getLineMaxColumn(line)),
                        options: { stickiness: monaco.editor.TrackedRangeStickiness.NeverGrowsWhenTypingAtEdges }
                    }]);

                    return (replacement) => {
                        const range = model.isDisposed() ? null : model.getDecorationRange(ids[0]);
                        if (!model.isDisposed()) model.deltaDecorations(ids, []);

                        if (!range || editorRef.current.getModel() !== model) {
                            // The content was replaced (for example, a file was opened) while
                            // waiting. Do not change the new content; the answer is kept in
                            // the prompt messages (Prompt window).
                            console.info('llama.cpp answer not inserted because the editor content was replaced:', replacement);
                            return;
                        }

                        if (range.isEmpty()) {
                            // The status line was deleted; insert at the cursor instead.
                            appendTextToEditor(replacement);
                            return;
                        }

                        editorRef.current.executeEdits('llamacpp', [{ range: range, text: replacement, forceMoveMarkers: true }]);
                    };
                };

                // One line of the prompt for the status comment.
                const summarize = (text) => {
                    const firstLine = String(text).split(/\r?\n/).find(x => x.trim() !== '') || '';
                    return firstLine.length > 80 ? firstLine.substring(0, 80) + '...' : firstLine;
                };

                // Generates text with the local llama.cpp model through the launcher
                // (/llamacpp/chat), which starts llama-server on the first request. The
                // answer replaces a status comment inserted below lineNumber.
                const askLlamaCpp = (promptMessage, lineNumber, summary) => {
                    const replace = insertPlaceholder(lineNumber,
                        `// ${summarize(summary)}... Generating text with llama.cpp (the first request may take a while to load the model)...`);
                    pushPromptMessage("user", promptMessage);

                    const data = {
                        messages: promptMessagesRef.current,
                        max_tokens: 2048,
                        temperature: 0.8,
                        top_p: 0.1,
                        presence_penalty: 0,
                        frequency_penalty: 0,
                        // For reasoning models (for example, FrogNano): without this they spend
                        // the token budget on reasoning_content (minutes on a CPU) before
                        // writing the answer. Templates without the option ignore it.
                        chat_template_kwargs: { enable_thinking: false }
                    };

                    axios.post('/llamacpp/chat', data, {
                        headers: { 'Content-Type': 'application/json' }
                    }).then(response => {
                        const choices = (response.data && response.data.choices) || [];
                        if (choices.length === 0) {
                            replace('// llama.cpp returned no response.');
                            return;
                        }

                        const blocks = choices.map(x => {
                            const message = x.message || {};
                            let responseContent = message.content || '';
                            let note = '';
                            if (!responseContent && message.reasoning_content) {
                                // The model ran out of tokens while reasoning.
                                note = `// llama.cpp returned only reasoning (finish_reason: ${x.finish_reason}).\n`;
                                responseContent = message.reasoning_content;
                            }
                            pushPromptMessage("assistant", responseContent);

                            // Keep the text inside the comment block.
                            const responseText = DOMPurify.sanitize(responseContent, { ALLOWED_TAGS: [], ALLOWED_ATTR: [] }).replace(/\*\//g, '* /');
                            return `${note}/*\n${responseText}\n*/`;
                        });
                        replace(blocks.join('\n'));
                    }).catch(error => {
                        // Launcher errors are {error: "..."}; llama-server errors are {error: {message}}.
                        const body = error.response && error.response.data;
                        const detail = body && body.error
                            ? (typeof body.error === 'string' ? body.error : (body.error.message || JSON.stringify(body.error)))
                            : error.message;
                        console.error('Error:', body || error.message);
                        replace(`// llama.cpp request failed: ${detail}`);
                    });
                };

                // ---- Web chat services (Copilot, ChatGPT) through the browser's DevTools protocol ----
                //
                // The launcher starts the browser with --remote-debugging-port and allows
                // this page's origin (--remote-allow-origins), so the editor can drive a
                // chat page that is open in the same browser: put the message into the
                // message box, send it, and read the answer from the page. If the page is
                // not open, it is opened in a popup window and used once its message box is
                // ready (sign in there if asked).
                //
                // Each service below lists the only page-specific parts (selectors and
                // scripts). The web UIs may change; update the service entry when they do.

                const WEB_CHAT_OPEN_WAIT_MS = 30000;   // wait for a newly opened window to appear
                const WEB_CHAT_READY_WAIT_MS = 180000; // wait for the message box (page load, sign-in)
                const WEB_CHAT_MAX_WAIT_MS = 300000;   // wait for the answer
                const WEB_CHAT_POLL_MS = 1500;
                const WEB_CHAT_STABLE_POLLS = 4;       // unchanged for ~6 s without a "finished" sign = finished
                const WEB_CHAT_CONFIRM_CHARS = 10000;

                // Evaluated in the chat page: replaces the content of a Lexical message box
                // with the text, one paragraph per line, through the editor instance that
                // Lexical attaches to its root element. Returns false when that is not
                // possible (not a Lexical editor, or the state was rejected).
                const buildSetLexicalTextScript = (inputSelector, text) => `(() => {
                    const el = document.querySelector(${JSON.stringify(inputSelector)});
                    const editor = el && el.__lexicalEditor;
                    if (!editor || typeof editor.parseEditorState !== 'function') return false;
                    const paragraph = line => ({
                        type: 'paragraph', version: 1, direction: line ? 'ltr' : null, format: '', indent: 0, textFormat: 0, textStyle: '',
                        children: line ? [{ type: 'text', version: 1, text: line, detail: 0, format: 0, mode: 'normal', style: '' }] : []
                    });
                    const lines = ${JSON.stringify(text)}.split('\\n');
                    try {
                        editor.setEditorState(editor.parseEditorState(JSON.stringify({
                            root: { type: 'root', version: 1, direction: 'ltr', format: '', indent: 0, children: lines.map(paragraph) }
                        })));
                    } catch (e) {
                        return false;
                    }
                    el.focus();
                    return true;
                })()`;

                // Evaluated in the chat page: pastes the text as plain text into an (empty)
                // contenteditable message box, the way a clipboard paste does. Editors such
                // as ProseMirror turn the lines into paragraphs and do not apply typing
                // shortcuts (Markdown input rules) to pasted text; ProseMirror's default
                // parser drops empty lines. Returns false when the box is not a
                // contenteditable.
                const buildPasteTextScript = (inputSelector, text) => `(() => {
                    const el = document.querySelector(${JSON.stringify(inputSelector)});
                    if (!el || !el.isContentEditable) return false;
                    el.focus();
                    const data = new DataTransfer();
                    data.setData('text/plain', ${JSON.stringify(text)});
                    el.dispatchEvent(new ClipboardEvent('paste', { clipboardData: data, bubbles: true, cancelable: true }));
                    return true;
                })()`;

                // Evaluated in the chat page: replaces the content of a Tiptap message box
                // with the text, one paragraph per line (empty lines kept), through the
                // editor instance that Tiptap attaches to its root element (el.editor).
                // Without such an instance it pastes the text, or, with pasteFallback false,
                // returns false so that the text is typed instead.
                const buildSetTiptapTextScript = (inputSelector, text, pasteFallback = true) => `(() => {
                    const el = document.querySelector(${JSON.stringify(inputSelector)});
                    const editor = el && el.editor;
                    if (!editor || !editor.commands || typeof editor.commands.setContent !== 'function')
                        return ${pasteFallback ? buildPasteTextScript(inputSelector, text) : 'false'};
                    const lines = ${JSON.stringify(text)}.split('\\n');
                    try {
                        editor.commands.setContent({
                            type: 'doc',
                            content: lines.map(line => line ? { type: 'paragraph', content: [{ type: 'text', text: line }] } : { type: 'paragraph' })
                        }, true);
                        editor.commands.focus('end');
                    } catch (e) {
                        return false;
                    }
                    return true;
                })()`;

                // Evaluated in the chat page: replaces the content of a Quill message box
                // (.ql-editor) with the text. Uses the Quill instance that Quill 1.x attaches
                // to its container (__quill); otherwise inserts the text as typed input
                // (execCommand insertText), which Quill picks up from the DOM. Text is not
                // pasted, because a long paste may be turned into an attachment.
                const buildSetQuillTextScript = (inputSelector, text) => `(() => {
                    const el = document.querySelector(${JSON.stringify(inputSelector)});
                    if (!el || !el.isContentEditable) return false;
                    const text = ${JSON.stringify(text)};
                    const container = el.closest('.ql-container') || el.parentElement;
                    const quill = container && container.__quill;
                    try {
                        if (quill && typeof quill.setText === 'function') {
                            quill.setText(text, 'user');
                            quill.setSelection(quill.getLength(), 0, 'user');
                            return true;
                        }
                        el.focus();
                        document.execCommand('selectAll', false, null);
                        return document.execCommand('insertText', false, text);
                    } catch (e) {
                        return false;
                    }
                })()`;

                // Source of a function, evaluated in the chat page, that returns an answer
                // element as text: each code block (options.block) becomes a Markdown fence
                // with the language from its header (options.label, without its buttons)
                // and the code (the options.codeAttribute attribute on the block or inside
                // it, when the page keeps the exact code there; otherwise the line elements
                // options.lines, or the text of options.code); the elements matched by options.remove
                // (citations and the like) and all buttons are left out. A copy is measured
                // off-screen so that innerText keeps the line breaks of the rendered answer.
                const buildAnswerToTextFunction = (options) => `((root) => {
                    const options = ${JSON.stringify(options)};
                    const each = (node, selector, fn) => Array.prototype.forEach.call(node.querySelectorAll(selector), fn);
                    const clone = root.cloneNode(true);
                    if (options.remove) each(clone, options.remove, e => e.remove());
                    if (options.block) each(clone, options.block, block => {
                        const header = options.label ? block.querySelector(options.label) : null;
                        let language = '';
                        if (header) {
                            const label = header.cloneNode(true);
                            each(label, '[role="button"], button', b => b.remove());
                            language = (label.textContent.trim().split(/\\s+/)[0] || '').toLowerCase();
                            // A label that is not a language name (such as "일반", plain text in
                            // the page's language) is left out.
                            if (!/^[a-z0-9+#._-]+$/.test(language)) language = '';
                            header.remove();
                        }
                        // The code is read before buttons are removed: some pages wrap a collapsed
                        // code block in a role=button element ("See all 13 lines").
                        const source = options.codeAttribute
                            ? (block.hasAttribute(options.codeAttribute) ? block : block.querySelector('[' + options.codeAttribute + ']'))
                            : null;
                        // options.lines: a code viewer that shows each line as its own element
                        // (empty lines hold a no-break space).
                        const lines = options.lines ? block.querySelectorAll(options.lines) : [];
                        const codeElement = options.code ? block.querySelector(options.code) : null;
                        let code;
                        if (source) {
                            code = source.getAttribute(options.codeAttribute);
                        } else if (lines.length) {
                            code = Array.prototype.map.call(lines, l => l.textContent.replace(/\\u00a0/g, ' ').replace(/^\\s+$/, '')).join('\\n');
                        } else if (codeElement) {
                            code = codeElement.textContent;
                        } else {
                            each(block, '[role="button"], button', b => b.remove());
                            code = block.textContent;
                        }
                        const fence = document.createElement('pre');
                        fence.textContent = '\`\`\`' + language + '\\n' + code.replace(/\\n$/, '') + '\\n\`\`\`';
                        block.parentNode.replaceChild(fence, block);
                    });
                    each(clone, '[role="button"], button', b => b.remove());
                    const holder = document.createElement('div');
                    holder.style.cssText = 'position:fixed;left:-100000px;top:0;width:800px;';
                    holder.appendChild(clone);
                    document.body.appendChild(holder);
                    const text = clone.innerText;
                    document.body.removeChild(holder);
                    return text.trim();
                })`;

                const WEB_CHATS = {
                    // Microsoft 365 Copilot chat (m365.cloud.microsoft/chat):
                    // - message box: span#m365-chat-editor-target-element, a Lexical
                    //   contenteditable. Enter sends; the send button is button[type=submit]
                    //   near the box (there is no form).
                    // - each turn: [data-testid=m365-chat-llm-web-ui-chat-message], holding the
                    //   question ([data-testid=chatQuestion]) and the answer
                    //   ([data-testid=copilot-message-div] > ... [data-testid=markdown-reply]).
                    // - a finished answer shows its copy/feedback bar
                    //   ([data-testid=CopyButtonContainerTestId]).
                    // The consumer site (copilot.microsoft.com: textarea and
                    // [data-content=ai-message]) is still recognized as a fallback.
                    // Text is set through Lexical rather than pasted, because Copilot may turn
                    // long pasted text into an attachment.
                    copilot: {
                        name: 'Copilot',
                        url: 'https://m365.cloud.microsoft/chat',
                        windowName: 'WelsonJSCopilot',
                        hosts: ['m365.cloud.microsoft', 'copilot.cloud.microsoft', 'copilot.microsoft.com'],
                        preferredPath: /\/chat\b/,
                        inputSelector: '#m365-chat-editor-target-element, textarea, [contenteditable="true"][role="textbox"]',
                        submitSelector: 'button[type="submit"]',
                        setText: buildSetLexicalTextScript,
                        stateScript: `(() => {
                            const turns = document.querySelectorAll('[data-testid="m365-chat-llm-web-ui-chat-message"]');
                            if (turns.length || document.getElementById('m365-chat-editor-target-element')) {
                                const turn = turns.length ? turns[turns.length - 1] : null;
                                const reply = turn ? turn.querySelector('[data-testid="copilot-message-div"]') : null;
                                // A code block (#code-block-host-...) has a header with the language
                                // ([data-testid=one-copilot-code-identity]) and buttons, then a code
                                // viewer with one element per line ([data-line-index]).
                                const toText = ${buildAnswerToTextFunction({ block: '[id^="code-block-host-"]', label: '[data-testid="one-copilot-code-identity"]', lines: '[data-line-index]' })};
                                const parts = reply ? Array.prototype.map.call(reply.querySelectorAll('[data-testid="markdown-reply"]'), toText).filter(t => t) : [];
                                return {
                                    count: turns.length,
                                    text: parts.join('\\n\\n'),
                                    done: !!(reply && reply.querySelector('[data-testid="CopyButtonContainerTestId"], [data-testid="FeedbackContainerTestId"]'))
                                };
                            }
                            const answers = document.querySelectorAll('[data-content=ai-message]');
                            return { count: answers.length, text: answers.length ? answers[answers.length - 1].innerText.trim() : '', done: false };
                        })()`
                    },

                    // ChatGPT (chatgpt.com):
                    // - message box: a ProseMirror contenteditable (role=textbox) inside
                    //   form[data-chatgpt-composer]. Enter sends; the send button,
                    //   button[type=submit] (aria-label "보내기" in Korean), appears inside the
                    //   form once the box has text (a voice button is shown while it is empty).
                    // - each turn: [data-turn-key] in [data-thread-find-target=conversation];
                    //   [data-talvt-turn-state] becomes "complete" when the answer is finished.
                    // - the answer: [data-markdown-text-style=assistant-message] in the turn
                    //   (after the [data-conversation-role=assistant] heading).
                    chatgpt: {
                        name: 'ChatGPT',
                        url: 'https://chatgpt.com/',
                        windowName: 'WelsonJSChatGPT',
                        hosts: ['chatgpt.com', 'chat.openai.com'],
                        preferredPath: null,
                        inputSelector: 'form[data-chatgpt-composer] [contenteditable="true"], #prompt-textarea, form [contenteditable="true"][role="textbox"]',
                        submitSelector: 'button[type="submit"], #composer-submit-button, [data-testid="send-button"]',
                        setText: buildPasteTextScript,
                        stateScript: `(() => {
                            // A code block ([data-client-defined-widget=code_block]) has a header
                            // with the language and buttons ([data-markdown-copy=exclude]) and keeps
                            // the exact code in data-chatgpt-copy-code.
                            const toText = ${buildAnswerToTextFunction({ block: '[data-client-defined-widget="code_block"]', label: '[data-markdown-copy="exclude"]', code: 'pre', codeAttribute: 'data-chatgpt-copy-code' })};
                            const turns = document.querySelectorAll('[data-turn-key]');
                            const turn = turns.length ? turns[turns.length - 1] : null;
                            const parts = turn ? Array.prototype.map.call(turn.querySelectorAll('[data-markdown-text-style="assistant-message"]'), toText).filter(t => t) : [];
                            const state = turn ? turn.querySelector('[data-talvt-turn-state]') : null;
                            return {
                                count: turns.length,
                                text: parts.join('\\n\\n'),
                                done: !!(state && state.getAttribute('data-talvt-turn-state') === 'complete')
                            };
                        })()`
                    },

                    // Grok (grok.com):
                    // - message box: a Tiptap (ProseMirror) contenteditable (role=textbox)
                    //   inside form[data-composer]. Enter sends; the send button is
                    //   button[type=submit][data-composer-action=send] in the form.
                    // - each question: [data-testid=user-message] (in [data-user-message-row]);
                    //   each answer: [data-testid=assistant-message], text in [data-markdown-row].
                    // - a finished answer shows its action bar,
                    //   [data-testid=response-footer-actions], next to the answer.
                    // Text is set through Tiptap rather than pasted, so that long text is not
                    // turned into an attachment and empty lines are kept.
                    grok: {
                        name: 'Grok',
                        url: 'https://grok.com/',
                        windowName: 'WelsonJSGrok',
                        hosts: ['grok.com'],
                        preferredPath: null,
                        inputSelector: 'form[data-composer] [contenteditable="true"], form [contenteditable="true"][role="textbox"], form textarea:not([aria-hidden="true"])',
                        submitSelector: 'button[data-composer-action="send"], button[type="submit"]',
                        setText: buildSetTiptapTextScript,
                        stateScript: `(() => {
                            const questions = document.querySelectorAll('[data-testid="user-message"]');
                            const answers = document.querySelectorAll('[data-testid="assistant-message"]');
                            const question = questions.length ? questions[questions.length - 1] : null;
                            let answer = answers.length ? answers[answers.length - 1] : null;
                            // Only an answer after the last question belongs to it.
                            if (answer && question && !(question.compareDocumentPosition(answer) & Node.DOCUMENT_POSITION_FOLLOWING))
                                answer = null;
                            // A code block ([data-markdown-code]) has a header (language and copy
                            // button) as its first child, then a pre.
                            const toText = ${buildAnswerToTextFunction({ block: '[data-markdown-code]', label: ':scope > div:first-child', code: 'pre' })};
                            const parts = answer ? Array.prototype.map.call(answer.querySelectorAll('[data-markdown-row]'), toText).filter(t => t) : [];
                            return {
                                count: questions.length,
                                text: parts.join('\\n\\n'),
                                done: !!(answer && answer.parentElement && answer.parentElement.querySelector('[data-testid="response-footer-actions"]'))
                            };
                        })()`
                    },

                    // Gemini (gemini.google.com/app):
                    // - message box: a Quill editor, div.ql-editor (role=textbox) in
                    //   rich-textarea, inside input-area-v2 (there is no form). Enter sends;
                    //   the send button is in [data-test-id=send-button-container]
                    //   (gem-icon-button.send-button), shown once the box has text.
                    // - each question: user-query; each answer: model-response, text in
                    //   message-content.
                    // - a finished answer has .response-footer.complete (and its
                    //   message-actions bar).
                    gemini: {
                        name: 'Gemini',
                        url: 'https://gemini.google.com/app',
                        windowName: 'WelsonJSGemini',
                        hosts: ['gemini.google.com'],
                        preferredPath: /^\/app\b/,
                        inputSelector: 'rich-textarea .ql-editor[contenteditable="true"], .ql-editor[contenteditable="true"][role="textbox"]',
                        submitSelector: '[data-test-id="send-button-container"] button, .send-button button, button.send-button',
                        setText: buildSetQuillTextScript,
                        stateScript: `(() => {
                            const questions = document.querySelectorAll('user-query');
                            const answers = document.querySelectorAll('model-response');
                            const question = questions.length ? questions[questions.length - 1] : null;
                            let answer = answers.length ? answers[answers.length - 1] : null;
                            // Only an answer after the last question belongs to it.
                            if (answer && question && !(question.compareDocumentPosition(answer) & Node.DOCUMENT_POSITION_FOLLOWING))
                                answer = null;
                            // A code block (code-block) has a header with the language and
                            // download/copy buttons (.code-block-decoration), then the code.
                            const toText = ${buildAnswerToTextFunction({ block: 'code-block', label: '.code-block-decoration', code: 'code[data-test-id="code-content"], pre' })};
                            const parts = answer ? Array.prototype.map.call(answer.querySelectorAll('message-content'), toText).filter(t => t) : [];
                            return {
