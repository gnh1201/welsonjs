                            };
                        })()`
                    },

                    // DeepSeek (chat.deepseek.com):
                    // - message box: textarea[name=search]. Enter sends; the send button is a
                    //   div[role=button].ds-button--primary.ds-button--circle, disabled with
                    //   the ds-button--disabled class while the box is empty.
                    // - options: .ds-toggle-button (aria-pressed) under the box: DeepThink
                    //   ("깊은 생각" in Korean) and Search ("검색").
                    // - messages: a virtual list of [data-virtual-list-item-key] items, each
                    //   with a .ds-message. The key of a question is -N and of its answer N,
                    //   increasing with each turn (older items may be removed from the DOM, so
                    //   the largest key counts the turns). An answer has
                    //   .ds-assistant-message-main-content (the DeepThink reasoning is
                    //   outside it); its copy/regenerate buttons appear next to the message
                    //   when it is finished.
                    deepseek: {
                        name: 'DeepSeek',
                        url: 'https://chat.deepseek.com/',
                        windowName: 'WelsonJSDeepSeek',
                        hosts: ['chat.deepseek.com'],
                        preferredPath: null,
                        inputSelector: 'textarea[name="search"], textarea#chat-input, textarea:not([aria-hidden="true"])',
                        submitSelector: '[role="button"].ds-button--primary.ds-button--circle',
                        setText: buildPasteTextScript,   // not used: a textarea is typed into
                        // DeepThink can take minutes before the answer starts.
                        maxWaitMs: 600000,
                        // Turns on DeepThink when it is available and off. It is found by its
                        // label (English, Chinese, Korean), so that another option such as
                        // Search is never switched by mistake. Returns true when it was clicked.
                        prepareScript: `(() => {
                            const toggles = Array.prototype.slice.call(document.querySelectorAll('.ds-toggle-button'));
                            const deepThink = toggles.find(t => /deep\\s*think|深度思考|깊은\\s*생각/i.test(t.innerText || ''));
                            if (!deepThink || deepThink.getAttribute('aria-pressed') === 'true' || deepThink.getAttribute('aria-disabled') === 'true')
                                return false;
                            deepThink.click();
                            return true;
                        })()`,
                        stateScript: `(() => {
                            const items = Array.prototype.slice.call(document.querySelectorAll('[data-virtual-list-item-key]'));
                            const keys = items.map(i => Math.abs(parseInt(i.getAttribute('data-virtual-list-item-key'), 10))).filter(k => !isNaN(k));
                            const messages = Array.prototype.slice.call(document.querySelectorAll('.ds-message'));
                            const isAnswer = m => !!m.querySelector('.ds-assistant-message-main-content');
                            const questions = messages.filter(m => !isAnswer(m));
                            const answers = messages.filter(isAnswer);
                            const question = questions.length ? questions[questions.length - 1] : null;
                            let answer = answers.length ? answers[answers.length - 1] : null;
                            // Only an answer after the last question belongs to it.
                            if (answer && question && !(question.compareDocumentPosition(answer) & Node.DOCUMENT_POSITION_FOLLOWING))
                                answer = null;
                            const content = answer ? answer.querySelector('.ds-assistant-message-main-content') : null;
                            const item = answer ? (answer.closest('[data-virtual-list-item-key]') || answer.parentElement) : null;
                            const actions = item ? Array.prototype.filter.call(item.querySelectorAll('[role="button"]'), b => !answer.contains(b)) : [];
                            // A code block (.md-code-block) is a banner with the language and
                            // copy/download buttons, then a pre.
                            const toText = ${buildAnswerToTextFunction({ block: '.md-code-block', label: '.md-code-block-banner', code: 'pre' })};
                            return {
                                count: keys.length ? Math.max.apply(null, keys) : questions.length,
                                text: content ? toText(content) : '',
                                done: actions.length > 0
                            };
                        })()`
                    },

                    // Perplexity (www.perplexity.ai):
                    // - message box: a Lexical contenteditable ([data-lexical-editor=true],
                    //   role=textbox). Enter sends; the send button is labelled "Submit"
                    //   ("제출" in Korean) and is disabled while the box is empty.
                    // - each question: [data-workflow-entry=N] with [data-message-bubble=right].
                    // - each answer: [data-workflow-final-text] with the text in
                    //   [data-renderer=lm]; [data-workflow-text-footer] (copy, share, ...)
                    //   appears when it is finished.
                    // - citations: [data-pplx-citation] chips inside the text, left out.
                    // - code blocks: pre > figure > figcaption (language, wrap and copy
                    //   buttons) and the code.
                    perplexity: {
                        name: 'Perplexity',
                        url: 'https://www.perplexity.ai/',
                        windowName: 'WelsonJSPerplexity',
                        hosts: ['www.perplexity.ai', 'perplexity.ai'],
                        preferredPath: null,
                        inputSelector: '#ask-input, [data-lexical-editor="true"][contenteditable="true"]',
                        submitSelector: 'button[data-testid="submit-button"], button[aria-label="Submit"], button[aria-label="제출"]',
                        setText: buildSetLexicalTextScript,
                        stateScript: `(() => {
                            const toText = ${buildAnswerToTextFunction({ remove: '[data-pplx-citation], .citation-nbsp', block: 'pre', label: 'figcaption', code: 'code' })};
                            const questions = document.querySelectorAll('[data-message-bubble="right"]');
                            const entries = Array.prototype.map.call(document.querySelectorAll('[data-workflow-entry]'), e => parseInt(e.getAttribute('data-workflow-entry'), 10)).filter(n => !isNaN(n));
                            const question = questions.length ? questions[questions.length - 1] : null;
                            // The final text of the answer; without one yet, the last rendered
                            // text that is not a question.
                            const finals = document.querySelectorAll('[data-workflow-final-text] [data-renderer="lm"]');
                            const texts = finals.length ? finals : Array.prototype.filter.call(document.querySelectorAll('[data-renderer="lm"]'), e => !e.closest('[data-message-bubble]'));
                            let answer = texts.length ? texts[texts.length - 1] : null;
                            // Only an answer after the last question belongs to it.
                            if (answer && question && !(question.compareDocumentPosition(answer) & Node.DOCUMENT_POSITION_FOLLOWING))
                                answer = null;
                            const container = answer ? answer.closest('[data-workflow-final-text]') : null;
                            return {
                                count: Math.max(questions.length, entries.length ? Math.max.apply(null, entries) + 1 : 0),
                                text: answer ? toText(answer) : '',
                                done: !!(container && container.querySelector('[data-workflow-text-footer] button'))
                            };
                        })()`
                    },

                    // Meta AI (www.meta.ai):
                    // - message box: a Lexical contenteditable,
                    //   div[data-testid=composer-input][data-lexical-editor=true] (a textarea
                    //   with the same test id stands in for it until the page is hydrated).
                    //   Enter sends; the send button is [data-testid=composer-send-button].
                    // - messages: [data-message-role=user|assistant] in the feed; an answer's
                    //   [data-testid=assistant-message] has data-streaming-complete=true when
                    //   it is finished. Its "Show thinking" status is left out.
                    // - code blocks: [data-server-code-block]: a header (language, copy and
                    //   download buttons), then a pre; a long one is collapsed ("See all N
                    //   lines", button[aria-expanded=false]) and has only its first lines in
                    //   the DOM until it is expanded.
                    // - sometimes it offers two responses side by side ("Which response do you
                    //   prefer?"), each in a column with a [data-scroll-container=true] and an
                    //   "I prefer this response" button. The first response is read, and
                    //   chosen once it is taken, so that the conversation goes on with it.
                    metaai: {
                        name: 'Meta AI',
                        url: 'https://www.meta.ai/',
                        windowName: 'WelsonJSMetaAI',
                        hosts: ['www.meta.ai', 'meta.ai'],
                        preferredPath: null,
                        // Not the stand-in textarea: it comes first in the page, and text typed
                        // into it is not sent.
                        inputSelector: 'div[data-testid="composer-input"][contenteditable="true"]',
                        submitSelector: '[data-testid="composer-send-button"]',
                        setText: buildSetLexicalTextScript,
                        stateScript: `(() => {
                            const toText = ${buildAnswerToTextFunction({
                                remove: '[data-testid="thinking-status"], [data-testid="subagent-cot-list"], [data-testid^="sbs-response-actions"], img',
                                block: '[data-server-code-block]', label: ':scope > div > div:first-child', code: 'pre'
                            })};
                            const questions = document.querySelectorAll('[data-message-role="user"]');
                            const answers = document.querySelectorAll('[data-message-role="assistant"]');
                            const question = questions.length ? questions[questions.length - 1] : null;
                            let answer = answers.length ? answers[answers.length - 1] : null;
                            // Only an answer after the last question belongs to it.
                            if (answer && question && !(question.compareDocumentPosition(answer) & Node.DOCUMENT_POSITION_FOLLOWING))
                                answer = null;
                            const message = answer ? (answer.querySelector('[data-testid="assistant-message"]') || answer) : null;
                            // Two responses side by side: the first (visible) one.
                            const columns = message ? Array.prototype.slice.call(message.querySelectorAll('[data-scroll-container="true"]')) : [];
                            const column = columns.find(c => c.offsetParent !== null) || columns[0];
                            const done = !!(message && message.getAttribute('data-streaming-complete') === 'true');
                            // A finished answer: expand its collapsed code blocks ("See all N
                            // lines"), which hold only their first lines until then. The text then
                            // changes, so it is read again on the next poll.
                            let expanded = 0;
                            if (done)
                                Array.prototype.forEach.call(message.querySelectorAll('[data-server-code-block] button[aria-expanded="false"]'), b => { b.click(); expanded++; });
                            return {
                                count: questions.length,
                                text: message ? toText(column || message) : '',
                                done: done && expanded === 0
                            };
                        })()`,
                        finishScript: `(() => {
                            const answers = document.querySelectorAll('[data-message-role="assistant"]');
                            const answer = answers.length ? answers[answers.length - 1] : null;
                            const columns = answer ? Array.prototype.slice.call(answer.querySelectorAll('[data-scroll-container="true"]')) : [];
                            const column = columns.find(c => c.offsetParent !== null) || columns[0];
                            // The "I prefer this response" button is a text button next to the
                            // column (the icon buttons have an aria-label).
                            const choose = column && column.parentElement && column.parentElement.querySelector('button[data-slot="button"]:not([aria-label])');
                            if (!choose) return false;
                            choose.click();
                            return true;
                        })()`
                    },

                    // Claude (claude.ai):
                    // - message box: a contenteditable, [data-testid=chat-input]. Enter sends;
                    //   the send button is [data-testid=chat-input-send], disabled while the box
                    //   is empty.
                    // - messages: a virtual list of [data-testid=transcript-row] items
                    //   (data-index counts the messages; older rows may be removed from the
                    //   DOM). A question is [data-testid=user-message]; an answer is
                    //   [data-testid=assistant-message], with data-is-streaming=false when it
                    //   is finished and its text in [data-perf-reply-text].
                    // - code blocks: [data-not-prose] > div[role=group]: a copy button, the
                    //   language ([data-find-omitted]), then a pre.
                    // Text is typed rather than pasted (unless the box is a Tiptap editor),
                    // because Claude turns long pasted text into an attachment.
                    claude: {
                        name: 'Claude',
                        url: 'https://claude.ai/new',
                        windowName: 'WelsonJSClaude',
                        hosts: ['claude.ai'],
                        preferredPath: null,
                        inputSelector: '[data-testid="chat-input"][contenteditable="true"], div.ProseMirror[contenteditable="true"]',
                        submitSelector: '[data-testid="chat-input-send"], button[aria-label="Send message"]',
                        setText: (inputSelector, text) => buildSetTiptapTextScript(inputSelector, text, false),
                        stateScript: `(() => {
                            const toText = ${buildAnswerToTextFunction({ block: '[data-not-prose]:has(pre)', label: '[data-find-omitted]', code: 'pre' })};
                            const rows = Array.prototype.map.call(document.querySelectorAll('[data-testid="transcript-row"][data-index]'), r => parseInt(r.getAttribute('data-index'), 10)).filter(n => !isNaN(n));
                            const questions = document.querySelectorAll('[data-testid="user-message"]');
                            const answers = document.querySelectorAll('[data-testid="assistant-message"]');
                            const question = questions.length ? questions[questions.length - 1] : null;
                            let answer = answers.length ? answers[answers.length - 1] : null;
                            // Only an answer after the last question belongs to it.
                            if (answer && question && !(question.compareDocumentPosition(answer) & Node.DOCUMENT_POSITION_FOLLOWING))
                                answer = null;
                            const parts = answer ? Array.prototype.map.call(answer.querySelectorAll('[data-perf-reply-text]'), toText).filter(t => t) : [];
                            return {
                                count: Math.max(questions.length, rows.length ? Math.max.apply(null, rows) + 1 : 0),
                                text: parts.join('\\n\\n'),
                                done: !!(answer && answer.getAttribute('data-is-streaming') === 'false')
                            };
                        })()`
                    }
                };

                // A chat service receives one text message per turn and does not know this
                // editor's conversation, so every turn sends all accumulated prompt
                // messages (including tool results such as Whois/DNS/IP) as one message.
                const buildWebChatMessage = (messages) => {
                    const lines = [
                        'Below is the whole conversation so far, including tool results, in order.',
                        'Reply to the last [user] message.',
                        ''
                    ];
                    messages.forEach(m => {
                        lines.push(`[${m && m.role ? m.role : 'user'}]`);
                        lines.push(String(m && m.content != null ? m.content : ''));
                        lines.push('');
                    });
                    return lines.join('\n').trim();
                };

                const delay = (ms) => new Promise(r => setTimeout(r, ms));

                // Minimal DevTools protocol client: send(method, params) resolves with the
                // result of the matching response.
                const openDevToolsSession = (wsUrl, name) => new Promise((resolve, reject) => {
                    const socket = new WebSocket(wsUrl);
                    const pending = {};
                    let nextId = 1;
                    socket.onmessage = (event) => {
                        const message = JSON.parse(event.data);
                        const handler = message.id && pending[message.id];
                        if (!handler) return;
                        delete pending[message.id];
                        if (message.error) handler.reject(new Error(message.error.message || JSON.stringify(message.error)));
                        else handler.resolve(message.result);
                    };
                    socket.onerror = () => reject(new Error(`Could not connect to the ${name} page (DevTools).`));
                    socket.onclose = () => Object.keys(pending).forEach(id => pending[id].reject(new Error('The DevTools connection was closed.')));
                    socket.onopen = () => resolve({
                        send: (method, params) => new Promise((res, rej) => {
                            const id = nextId++;
                            pending[id] = { resolve: res, reject: rej };
                            socket.send(JSON.stringify({ id: id, method: method, params: params || {} }));
                        }),
                        evaluate: function (expression) {
                            return this.send('Runtime.evaluate', { expression: expression, returnByValue: true })
                                .then(r => r && r.result ? r.result.value : undefined);
                        },
                        // text: the character the key produces ('\r' for Enter), so that the
                        // page also receives keypress/beforeinput like a real key press.
                        key: function (key, code, keyCode, modifiers, text) {
                            const base = { key: key, code: code, windowsVirtualKeyCode: keyCode, modifiers: modifiers || 0 };
                            const down = text
                                ? Object.assign({ type: 'keyDown', text: text, unmodifiedText: text }, base)
                                : Object.assign({ type: 'rawKeyDown' }, base);
                            return this.send('Input.dispatchKeyEvent', down)
                                .then(() => this.send('Input.dispatchKeyEvent', Object.assign({ type: 'keyUp' }, base)));
                        },
                        close: () => socket.close()
                    });
                });

                // Puts the message into the chat page, sends it, and waits for a new answer.
                // Resolves with the answer text.
                const runWebChatTurn = async (service, wsUrl, text) => {
                    const session = await openDevToolsSession(wsUrl, service.name);
                    const SHIFT = 8, CTRL = 2;
                    const input = JSON.stringify(service.inputSelector);
                    // Focuses the message box; returns its tag ('TEXTAREA', 'DIV', ...) or null.
                    const focusInput = `(() => { const el = document.querySelector(${input}); if (!el) return null; el.focus(); return el.tagName; })()`;
                    const inputText = `(() => { const el = document.querySelector(${input}); return el ? (el.value !== undefined ? el.value : el.innerText) : ''; })()`;
                    // Clicks the send button nearest to the message box: inside its form if it
                    // has one, otherwise in the closest ancestor that contains one.
                    const submit = `(() => {
                        const el = document.querySelector(${input});
                        if (!el) return 'no-input';
                        const form = el.closest('form');
                        for (let node = form || el.parentElement; node; node = form ? null : node.parentElement) {
                            const button = node.querySelector(${JSON.stringify(service.submitSelector)});
                            if (!button) continue;
                            // Some send buttons are divs disabled by a class (ds-button--disabled).
                            if (button.disabled || button.getAttribute('aria-disabled') === 'true' || button.matches('[class*="--disabled"]')) return 'disabled';
                            button.click();
                            return 'clicked';
                        }
                        return 'no-button';
                    })()`;
                    const pressEnter = async () => {
                        await session.evaluate(focusInput);
                        await session.key('Enter', 'Enter', 13, 0, '\r');
                    };
                    const hasText = async () => String(await session.evaluate(inputText)).trim() !== '';
                    try {
                        // A page that was just opened may still be loading or waiting for sign-in.
                        const readyDeadline = Date.now() + WEB_CHAT_READY_WAIT_MS;
                        let tag;
                        while (!(tag = await session.evaluate(focusInput))) {
                            if (Date.now() >= readyDeadline)
                                throw new Error(`Could not find the ${service.name} message box. Sign in to ${service.name} in its window, then try again.`);
                            await delay(WEB_CHAT_POLL_MS);
                        }

                        // Service options to set before sending (DeepSeek: turn on DeepThink).
                        if (service.prepareScript && await session.evaluate(service.prepareScript))
                            await delay(500);

                        const before = await session.evaluate(service.stateScript);

                        // Clear a draft the user may have left in the box. Editors such as
                        // ProseMirror track the selection themselves, so use real keys.
                        const clearDraft = async () => {
                            if (await hasText()) {
                                await session.evaluate(focusInput);
                                await session.key('a', 'KeyA', 65, CTRL);
                                await session.key('Backspace', 'Backspace', 8);
                            }
                        };
                        await clearDraft();

                        // Put the text in with the service's method; fall back to typing it.
                        let placed = tag !== 'TEXTAREA' && await session.evaluate(service.setText(service.inputSelector, text));
                        if (placed) {
                            // The editor may apply the change asynchronously.
                            for (let i = 0; i < 10 && !(placed = await hasText()); i++)
                                await delay(100);
                        }
                        if (!placed) {
                            // Type it (line by line with Shift+Enter in a contenteditable box).
                            await clearDraft();
                            if (tag === 'TEXTAREA') {
                                await session.send('Input.insertText', { text: text });
                            } else {
                                const lines = text.split('\n');
                                for (let i = 0; i < lines.length; i++) {
                                    if (i > 0) {
                                        await session.key('Enter', 'Enter', 13, SHIFT, '\r');
                                        await delay(20);
                                    }
                                    if (lines[i])
                                        await session.send('Input.insertText', { text: lines[i] });
                                }
                            }
                        }
                        if (!(await hasText()))
                            throw new Error(`The message could not be typed into the ${service.name} message box.`);

                        // Send: click the send button once it is enabled; without one, press
                        // Enter. Then make sure the message left the box or a new turn started.
                        let result = 'disabled';
                        for (let i = 0; i < 10 && (result === 'disabled' || (result === 'no-button' && i < 3)); i++) {
                            await delay(300);
                            result = await session.evaluate(submit);
                        }
                        if (result !== 'clicked')
                            await pressEnter();

                        const isSent = async () => {
                            const state = await session.evaluate(service.stateScript);
                            return (state && state.count > before.count) || !(await hasText());
                        };
                        let sent = false;
                        for (let i = 0; i < 2 && !sent; i++) {
                            if (i > 0)
                                await pressEnter();   // the click (or key) had no effect; try Enter once more
                            for (let w = 0; w < 10 && !(sent = await isSent()); w++)
                                await delay(500);
                        }
                        if (!sent)
                            throw new Error(`The message was typed but ${service.name} did not send it (the send button and Enter had no effect).`);

                        const maxWait = service.maxWaitMs || WEB_CHAT_MAX_WAIT_MS;
                        const deadline = Date.now() + maxWait;
                        let last = '', stable = 0;
                        while (Date.now() < deadline) {
                            await delay(WEB_CHAT_POLL_MS);
                            const state = await session.evaluate(service.stateScript);
                            if (!state || state.count <= before.count || !state.text) {
                                stable = 0;
                                continue;
                            }
                            stable = (state.text === last) ? stable + 1 : 0;
                            last = state.text;
                            // Finished: the page marks the answer as finished and the text has
                            // stopped changing, or the text has not changed for a while.
                            if ((state.done && stable >= 1) || stable >= WEB_CHAT_STABLE_POLLS) {
                                // Something to do on the page once the answer is taken (Meta AI:
                                // choose the response that was read when it offers two).
                                if (service.finishScript)
                                    await session.evaluate(service.finishScript);
                                return last;
                            }
                        }
                        throw new Error(`${service.name} did not finish answering within ${maxWait / 1000} seconds.` +
                            (last ? ` Partial answer:\n${last}` : ''));
                    } finally {
                        session.close();
                    }
                };

                // Finds an open page of the service, preferring its chat path when it has one.
                const findWebChatTarget = async (service) => {
                    const response = await fetch('/devtools/json');
                    if (!response.ok)
                        throw new Error(`The launcher could not reach the browser's DevTools (HTTP ${response.status}).`);
                    const pages = ((await response.json()) || []).filter(t => {
                        if (t.type !== 'page') return false;
                        try { return service.hosts.indexOf(new URL(t.url).hostname) >= 0; } catch (e) { return false; }
                    });
                    return (service.preferredPath && pages.find(t => service.preferredPath.test(new URL(t.url).pathname))) || pages[0];
                };

                // Returns the service's page, opening it (in the launcher's browser) when
                // none is open. Like the prompt editor and the terminal, it opens as a popup
                // window (window features) instead of a tab. window.open runs within the
                // context menu click's user activation, so popup blockers allow it.
                const getOrOpenWebChatTarget = async (service) => {
                    let target = await findWebChatTarget(service);
                    if (target)
                        return target;

                    if (!window.open(service.url, service.windowName, 'width=1000,height=800,resizable=yes,scrollbars=yes'))
                        throw new Error(`The browser blocked opening ${service.name}. Allow popups for this page, or open ${service.url} and try again.`);

                    const deadline = Date.now() + WEB_CHAT_OPEN_WAIT_MS;
                    while (Date.now() < deadline) {
                        await delay(1000);
                        target = await findWebChatTarget(service);
                        if (target)
                            return target;
                    }
                    throw new Error(`The ${service.name} window did not open. Make sure the editor runs in the browser started by the launcher (remote debugging).`);
                };

                // Sends the whole accumulated prompt plus promptMessage to a web chat
                // service. The answer replaces a status comment inserted below lineNumber.
                const askWebChat = (service, promptMessage, lineNumber, summary) => {
                    const count = promptMessagesRef.current.length + 1;
                    const text = buildWebChatMessage(promptMessagesRef.current.concat([{ role: 'user', content: promptMessage }]));
                    if (text.length > WEB_CHAT_CONFIRM_CHARS &&
                        !confirm(`The accumulated prompt is ${text.length} characters (${count} messages). ${service.name} may reject long messages. Send it anyway?`))
                        return;

                    const status = `// ${summarize(summary)}... Sending the whole prompt (${count} messages) to ${service.name}`;
                    const replace = insertPlaceholder(lineNumber, status + '...');
                    pushPromptMessage("user", promptMessage);

                    (async () => {
                        try {
                            const target = await getOrOpenWebChatTarget(service);
                            const answer = await runWebChatTurn(service, target.webSocketDebuggerUrl, text);
                            pushPromptMessage("assistant", answer);
                            // Keep the text inside the comment block.
                            replace(`/*\n${DOMPurify.sanitize(answer, { ALLOWED_TAGS: [], ALLOWED_ATTR: [] }).replace(/\*\//g, '* /')}\n*/`);
                        } catch (e) {
                            console.error(`${service.name} error:`, e);
                            replace(`// ${service.name} request failed: ${String(e && e.message ? e.message : e).replace(/\r?\n/g, ' ')}`);
                        }
                    })();
                };

                // The web chat service chosen in the ribbon (WEB_CHATS key), remembered
                // across sessions.
                const WEB_CHAT_STORAGE_KEY = 'welsonjs.editor.webChat';
                const [webChatKey, setWebChatKey] = React.useState(() => {
                    try {
                        const saved = localStorage.getItem(WEB_CHAT_STORAGE_KEY);
                        if (saved && WEB_CHATS[saved])
                            return saved;
                    } catch (e) {}
                    return 'copilot';
                });
                const webChatEditorRef = React.useRef(null);
                const webChatActionsRef = React.useRef([]);

                // Editor context menu: llama.cpp, and the web chat service chosen in the
                // ribbon. "Send" and "Explain" need a selection; "Ask..." asks for a
                // message and includes the selection, if any. The answer goes below the
                // selection (or the cursor line). Returns the added actions (disposables).
                const addProviderActions = (editor, provider) => {
                    const getContext = () => {
                        const model = editor.getModel();
                        const selection = editor.getSelection();
                        if (!selection || selection.isEmpty()) {
                            const position = editor.getPosition() || { lineNumber: 1 };
                            return { text: '', endLine: position.lineNumber, language: model.getLanguageId() };
                        }

                        // A selection of whole lines ends at column 1 of the next line.
                        const endLine = (selection.endColumn === 1 && selection.endLineNumber > selection.startLineNumber)
                            ? selection.endLineNumber - 1
                            : selection.endLineNumber;
                        return { text: model.getValueInRange(selection), endLine: endLine, language: model.getLanguageId() };
                    };

                    const fence = (context) => '```' + context.language + '\n' + context.text + '\n```';

                    const actions = [
                        {
                            id: 'sendSelection',
                            label: 'Send Selection',
                            precondition: 'editorHasSelection',
                            build: context => ({ message: context.text, summary: context.text })
                        },
                        {
                            id: 'explainSelection',
                            label: 'Explain Selection',
                            precondition: 'editorHasSelection',
                            build: context => ({
                                message: 'Explain what the following code does.\n\n' + fence(context),
                                summary: 'Explain the selection'
                            })
                        },
                        {
                            id: 'ask',
                            label: 'Ask...',
                            precondition: undefined,
                            build: context => {
                                const question = prompt(context.text
                                    ? `Ask ${provider.name} about the selection:`
                                    : `Ask ${provider.name}:`, '');
                                if (!question || question.trim() === '')
                                    return null;
                                return {
                                    message: context.text ? question + '\n\n' + fence(context) : question,
                                    summary: question
                                };
                            }
                        }
                    ];

                    return actions.map((action, index) => editor.addAction({
                        id: `welsonjs.${provider.key}.${action.id}`,
                        label: `${provider.name}: ${action.label}`,
                        precondition: action.precondition,
                        contextMenuGroupId: provider.group,
                        contextMenuOrder: index + 1,
                        run: () => {
                            const context = getContext();
                            if (action.precondition && !context.text)
                                return;

                            const request = action.build(context);
                            if (request)
                                provider.ask(request.message, context.endLine, request.summary);
                        }
                    }));
                };

                // Replaces the web chat actions with the ones for the chosen service, so
                // the menu shows its name ("Copilot: Ask...", "ChatGPT: Ask...").
                const registerWebChatActions = (key) => {
                    const editor = webChatEditorRef.current;
                    if (!editor)
                        return;

                    webChatActionsRef.current.forEach(action => action.dispose());
                    const service = WEB_CHATS[key];
                    webChatActionsRef.current = addProviderActions(editor, {
                        key: 'webchat',
                        name: service.name,
                        group: '2_webchat',
                        ask: (m, l, s) => askWebChat(service, m, l, s)
                    });
                };

                const registerAiActions = (editor) => {
                    addProviderActions(editor, { key: 'llamacpp', name: 'llama.cpp', group: '1_llamacpp', ask: askLlamaCpp });
                    webChatEditorRef.current = editor;
                    registerWebChatActions(webChatKey);
                };

                // Ribbon toggle: switches to the next web chat service and says how to use it.
                const toggleWebChat = () => {
                    const keys = Object.keys(WEB_CHATS);
                    const key = keys[(keys.indexOf(webChatKey) + 1) % keys.length];
                    const name = WEB_CHATS[key].name;

                    setWebChatKey(key);
                    try {
                        localStorage.setItem(WEB_CHAT_STORAGE_KEY, key);
                    } catch (e) {}
                    registerWebChatActions(key);

                    alert(`The web chat service is now ${name}.\n\n` +
                        `Right-click in the editor and choose "${name}: Send Selection", ` +
                        `"${name}: Explain Selection" or "${name}: Ask..." to use it.`);
                };

                const savePromptMessages = () => {
                    const text = JSON.stringify(promptMessagesRef.current, null, 4);
                    const blob = new Blob([text], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = "prompt.json";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                const loadPromptMessages = () => {
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = '.json';
                    fileInput.onchange = function (event) {
                        const file = event.target.files[0];

                        if (!file)
                            return;

                        let reader = new FileReader();
                        reader.onload = function (e) {
                            promptMessagesRef.current = JSON.parse(e.target.result);
                            notifyPromptMessages(null);
                            appendTextToEditor("\n//Prompt loaded successfully.");
                        };
                        reader.readAsText(file);
                    };
                    fileInput.click();
                };

                const queryWhois = () => {
                    const hostname = prompt("Enter a hostname or IP address:", '');
                    if (!hostname || hostname.trim() == '') {
                        appendTextToEditor("\n// A hostname or IP address is required.");
                        return;
                    }

                    axios.get(`/whois/${hostname}`).then(response => {
                        const responseText = DOMPurify.sanitize(response.data, { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
                        appendTextToEditor(`/*\nHostname:${hostname}\n\n${responseText}\n*/`);
                        pushPromptMessage("system", responseText);
                    }).catch(error => {
                        console.error(error);
                    });
                };

                const queryDns = () => {
                    const hostname = prompt("Enter a hostname or IP address:", '');
                    if (!hostname || hostname.trim() == '') {
                        appendTextToEditor("\n// A hostname or IP address is required.");
                        return;
                    }

                    axios.get(`/dns-query/${hostname}`).then(response => {
                        const responseText = response.data;
                        appendTextToEditor(`/*\nHostname:${hostname}\n\n${responseText}\n*/`);
                        pushPromptMessage("system", responseText);
                    }).catch(error => {
                        console.error(error);
                    });
                };

                const queryIp = () => {
                    const hostname = prompt("Enter IP address:", '');
                    if (!hostname || hostname.trim() === '') {
                        appendTextToEditor("\n// IP address is required.");
                        return;
                    }
                    const ip = encodeURIComponent(hostname.trim());

                    axios.get(`/ip-query/${hostname}`).then(res => {
                        if (!res || !res.data) {
                            appendTextToEditor("\n// No data returned from server.");
                            return;
                        }

                        // Parse XML and keep attributes (provider, status)
                        const parser = new XMLParser({ ignoreAttributes: false, attributeNamePrefix: "@_" });
                        const parsed = parser.parse(res.data);

                        // Expected XML:
                        // <result target="...">
                        //   <response provider="criminalip" status="200">
                        //     <text>{ "...raw json..." }</text>
                        //   </response>
                        //   <response provider="abuseipdb" status="200">
                        //     <text>{ "...raw json..." }</text>
                        //   </response>
                        // </result>

                        // Normalize to an array of <response> nodes
                        const responsesNode = parsed?.result?.response;
                        const responses = Array.isArray(responsesNode)
                            ? responsesNode
                            : (responsesNode ? [responsesNode] : []);

                        if (responses.length === 0) {
                            appendTextToEditor("\n// No <response> nodes found.");
                            return;
                        }

                        // Extract each <response><text> content and print
                        let out = "\n// --- IP Query Results ---";
                        for (const r of responses) {
                            const provider = r?.["@_provider"] || "unknown";
                            const status = r?.["@_status"] || "n/a";

                            // Fast-XML-Parser usually makes <text> a string, but be safe:
                            let txt = r?.text;
                            if (txt && typeof txt === "object") {
                                // If parser produced an object with a '#text' key or similar
                                txt = txt["#text"] || JSON.stringify(txt);
                            }
                            if (txt == null) txt = "";

                            out += `\n// provider=${provider}, status=${status}\n${txt}\n`;
                        }
                        out = "\n/*" + out + "*/\n";

                        appendTextToEditor(out);
                        pushPromptMessage("system", out);
                    }).catch(error => {
                        console.error(error);
                        appendTextToEditor(`\n// Failed to query the IP: ${error.message}`);
                    });
                };
                
                const extractCoordinates = (source) => {
                    const coordinates = [];
                    const seen = {};
                    const pattern = /(-?\d{1,3}(?:\.\d+)?)\s*[,;]\s*(-?\d{1,3}(?:\.\d+)?)/g;
                    let match;

                    while ((match = pattern.exec(source || '')) !== null) {
                        const latitude = Number(match[1]);
                        const longitude = Number(match[2]);
                        if (latitude < -90 || latitude > 90 || longitude < -180 || longitude > 180)
                            continue;

                        const key = latitude + ',' + longitude;
                        if (!seen[key]) {
                            seen[key] = true;
                            coordinates.push({ latitude: latitude, longitude: longitude });
                        }
                    }

                    return coordinates;
                };

                const plotEditorCoordinates = () => {
                    const map = mapViewRef.current;
                    if (!map || typeof L === 'undefined')
                        return;

                    coordinateMarkersRef.current.forEach(marker => map.removeLayer(marker));
                    coordinateMarkersRef.current = [];

                    const coordinates = extractCoordinates(editorRef.current ? editorRef.current.getValue() : '');
                    const bounds = [];
                    coordinates.forEach(coordinate => {
                        const latlng = [coordinate.latitude, coordinate.longitude];
                        const marker = L.marker(latlng)
                            .addTo(map)
                            .bindPopup('Coordinate: ' + coordinate.latitude + ', ' + coordinate.longitude);
                        coordinateMarkersRef.current.push(marker);
                        bounds.push(latlng);
                    });

                    if (bounds.length === 1)
                        map.setView(bounds[0], 14);
                    else if (bounds.length > 1)
                        map.fitBounds(bounds, { padding: [30, 30] });
                };

                function toggleMap() {
                    const nextVisible = !showMap;
                    setShowMap(nextVisible);
                    if (nextVisible)
                        setTimeout(plotEditorCoordinates, 100);
                }

                const openDiscord = () => navigate('https://discord.gg/XKG5CjtXEj?utm_source=welsonjs');
                const openKakao = () => navigate('https://pf.kakao.com/_mNxisj');

                React.useEffect(() => {
                    window.addEventListener('resize', () => {
                        resizeEditor();
                    });
                    window.dispatchEvent(new Event('resize'));
                }, []);

                React.useEffect(() => {
                }, []);

                return _e('div', { className: 'app' },
                    _e(RibbonMenu, {
                        webChatName: WEB_CHATS[webChatKey].name,
                        onWebChatToggleClick: toggleWebChat,
                        onOpenFileClick: openFile,
                        onSaveFileClick: saveFile,
                        onPromptEditorClick: openPromptEditor,
                        onSavePromptClick: savePromptMessages,
                        onLoadPromptClick: loadPromptMessages,
                        onQueryWhoisClick: queryWhois,
                        onQueryDnsClick: queryDns,
                        onQueryIpClick: queryIp,
                        onMapClick: toggleMap,
                        onRunScriptClick: runScript,
                        onTerminalClick: openTerminal,
                        onExcelExampleClick: showExcelExample,
                        onPowerPointExampleClick: showPowerPointExample,
                        onWordExampleClick: showWordExample,
                        onHwpExampleClick: showHwpExample,
                        onDiscordClick: openDiscord,
                        onKakaoClick: openKakao,
                        onWorldTouristExampleClick: showWorldTouristExample,
                    }),
                    _e('div', { id: 'container' },
                        _e(Editor, { editorRef: editorRef, visible: !showMap, onReady: registerAiActions }),
                        _e(MapView, { mapViewRef: mapViewRef, visible: showMap })
                    ),
                    _e('div', { className: 'banner' }, _e('a', { href: 'https://github.com/gnh1201/welsonjs' }, '❤️ Contribute this project')),
                );
            }

            const container = document.getElementById('app');
            const root = ReactDOM.createRoot(container);
            root.render(_e(App));
        });
    </script>
</body>
</html>
