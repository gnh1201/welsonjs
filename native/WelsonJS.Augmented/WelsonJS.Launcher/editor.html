                    if (typeof ABCJS === 'undefined' || !text || text.length > ABC_MAX_SELECTION)
                        return null;
                    if (!/^[ \t]*K:/m.test(text))
                        return null;
                    const prefix = /^[ \t]*X:/m.test(text) ? '' : 'X:1\n';
                    const abc = prefix + text;
                    try {
                        const tunes = ABCJS.parseOnly(abc);
                        const hasMusic = tunes.some(tune => (tune.lines || []).some(line => line.staff && line.staff.length > 0));
                        return hasMusic ? { abc: abc, offset: prefix.length } : null;
                    } catch (e) {
                        return null;
                    }
                };

                // The ABC to work on: the selection, or the whole file when its language is "abc".
                const getAbcSource = (editor) => {
                    const model = editor.getModel();
                    if (!model)
                        return null;
                    const selection = editor.getSelection();
                    let range;
                    if (selection && !selection.isEmpty())
                        range = selection;
                    else if (model.getLanguageId() === 'abc')
                        range = model.getFullModelRange();
                    else
                        return null;
                    const tune = toAbcTune(model.getValueInRange(range));
                    return tune ? Object.assign({ range: range }, tune) : null;
                };

                // The tunes of an ABC text, split at their X: lines.
                const splitAbcTunes = (abc) => abc.split(/(?=^[ \t]*X:)/m).filter(tune => /^[ \t]*K:/m.test(tune));

                // A file name from the first T: (title) header.
                const abcFileName = (abc, extension) => {
                    const title = (abc.match(/^[ \t]*T:(.*)$/m) || [, ''])[1].trim();
                    const safe = title.replace(/[\\/:*?"<>|\x00-\x1f]+/g, '_').replace(/\s+/g, ' ').substring(0, 80).trim();
                    return (safe || 'tune') + extension;
                };

                const downloadBlob = (blob, fileName) => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
                };

                // Each tune as a standard MIDI file. getMidiFile converts the first tune only.
                const downloadAbcMidi = (abc, transpose) => {
                    try {
                        const tunes = splitAbcTunes(abc);
                        tunes.forEach((tune, i) => {
                            const files = ABCJS.synth.getMidiFile(tune, { midiOutputType: 'binary', midiTranspose: transpose || 0 });
                            const data = Array.isArray(files) ? files[0] : files;
                            downloadBlob(new Blob([data], { type: 'audio/midi' }),
                                abcFileName(tune, tunes.length > 1 && !/^[ \t]*T:/m.test(tune) ? `-${i + 1}.mid` : '.mid'));
                        });
                    } catch (e) {
                        console.error('ABC to MIDI failed:', e);
                        alert('The tune could not be converted to MIDI: ' + e.message);
                    }
                };

                // A synthesizer primed with the instrument samples for a drawn tune.
                let abcAudioContext = null;
                const primeAbcSynth = async (visualObj, transpose) => {
                    if (!ABCJS.synth.supportsAudio())
                        throw new Error('this browser cannot play audio');
                    abcAudioContext = abcAudioContext || new (window.AudioContext || window.webkitAudioContext)();
                    await abcAudioContext.resume();
                    const synth = new ABCJS.synth.CreateSynth();
                    await synth.init({
                        visualObj: visualObj,
                        audioContext: abcAudioContext,
                        millisecondsPerMeasure: visualObj.millisecondsPerMeasure(),
                        options: { soundFontUrl: ABC_SOUNDFONT_URL, midiTranspose: transpose || 0 }
                    });
                    await synth.prime();
                    return synth;
                };

                // The first tune as a WAV file (rendered off screen when no score is shown).
                const downloadAbcWav = async (abc, transpose, visualObj) => {
                    try {
                        const visual = visualObj || ABCJS.renderAbc(document.createElement('div'), abc)[0];
                        const synth = await primeAbcSynth(visual, transpose);
                        const url = synth.download();
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = abcFileName(abc, '.wav');
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 10000);
                    } catch (e) {
                        console.error('ABC to WAV failed:', e);
                        alert('The tune could not be converted to WAV: ' + e.message);
                    }
                };

                // The source transposed by a number of semitones (key signatures and chord symbols too).
                const transposeAbcText = (source, steps) => {
                    const out = ABCJS.strTranspose(source.abc, ABCJS.parseOnly(source.abc), steps);
                    return source.offset ? out.substring(source.offset) : out;
                };

                const transposeAbcSource = (editor, source, steps) => {
                    try {
                        editor.executeEdits('abc-transpose', [{ range: source.range, text: transposeAbcText(source, steps), forceMoveMarkers: true }]);
                    } catch (e) {
                        console.error('ABC transposition failed:', e);
                        alert('The tune could not be transposed: ' + e.message);
                    }
                };

                // The score panel beside the editor (one at a time).
                let abcPanel = null;
                const ensureAbcStyles = () => {
                    if (document.getElementById('welsonjs-abc-styles'))
                        return;
                    const style = document.createElement('style');
                    style.id = 'welsonjs-abc-styles';
                    style.textContent =
                        '.welsonjs-abc-panel{position:fixed;top:0;right:0;width:min(600px,48vw);height:100vh;z-index:10000;background:#fff;color:#000;' +
                        'display:flex;flex-direction:column;border-left:1px solid #ccc;box-shadow:-4px 0 16px rgba(0,0,0,0.2);font:13px sans-serif;}' +
                        '.welsonjs-abc-panel .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid #e5e5e5;}' +
                        '.welsonjs-abc-panel .title{flex:1;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}' +
                        '.welsonjs-abc-panel .status{padding:4px 10px;color:#a40;min-height:1em;}' +
                        '.welsonjs-abc-panel .paper{flex:1;overflow:auto;padding:10px;}' +
                        '.welsonjs-abc-panel .paper .abcjs-note,.welsonjs-abc-panel .paper .abcjs-rest{cursor:pointer;}' +
                        '.welsonjs-abc-panel .abcjs-playing,.welsonjs-abc-panel .abcjs-playing path{fill:#d33;}';
                    document.head.appendChild(style);
                };

                const openAbcScore = (editor, source) => {
                    if (abcPanel)
                        abcPanel.close();
                    ensureAbcStyles();
                    const model = editor.getModel();
                    // The source range follows edits, for the live preview and for clicks on notes.
                    let decorations = model.deltaDecorations([], [{
                        range: source.range,
                        options: { stickiness: monaco.editor.TrackedRangeStickiness.AlwaysGrowsWhenTypingAtEdges }
                    }]);
                    const state = { abc: source.abc, offset: source.offset, transpose: 0, tablature: '', visual: [] };

                    const el = (tag, text, cls) => {
                        const e = document.createElement(tag);
                        if (text) e.textContent = text;
                        if (cls) e.className = cls;
                        return e;
                    };
                    const panel = el('div', '', 'welsonjs-abc-panel');
                    const bar1 = el('div', '', 'bar'), bar2 = el('div', '', 'bar');
                    const title = el('span', '', 'title');
                    const close = el('button', 'Close');
                    const down = el('button', '\u2212'), up = el('button', '+');
                    down.title = 'Transpose the view down a semitone';
                    up.title = 'Transpose the view up a semitone';
                    const steps = el('span', 'Transpose: 0');
                    const apply = el('button', 'Apply to source');
                    apply.title = 'Rewrite the source in the transposed key';
                    const tab = el('select');
                    ABC_TABLATURES.forEach(([value, label]) => {
                        const o = el('option', label);
                        o.value = value;
                        tab.appendChild(o);
                    });
                    const play = el('button', 'Play');
                    const svg = el('button', 'Save SVG'), midi = el('button', 'MIDI'), wav = el('button', 'WAV');
                    const status = el('div', '', 'status');
                    const paper = el('div', '', 'paper');
                    bar1.append(title, close);
                    bar2.append(down, steps, up, apply, tab, play, svg, midi, wav);
                    panel.append(bar1, bar2, status, paper);
                    document.body.appendChild(panel);

                    const setStatus = (text) => { status.textContent = text || ''; };
                    const sourceRange = () => {
                        const range = model.isDisposed() ? null : model.getDecorationRange(decorations[0]);
                        return range && !range.isEmpty() ? range : null;
                    };

                    // A click on a note selects its text in the source.
                    const onClick = (abcElem) => {
                        const range = sourceRange();
                        if (!range || typeof abcElem.startChar !== 'number' || abcElem.startChar < 0)
                            return;
                        const base = model.getOffsetAt(range.getStartPosition());
                        const start = Math.max(0, abcElem.startChar - state.offset);
                        const end = Math.max(start, abcElem.endChar - state.offset);
                        const s = model.getPositionAt(base + start), e = model.getPositionAt(base + end);
                        const selection = new monaco.Selection(s.lineNumber, s.column, e.lineNumber, e.column);
                        editor.setSelection(selection);
                        editor.revealRangeInCenterIfOutsideViewport(selection);
                        editor.focus();
                    };

                    const render = () => {
                        const options = { responsive: 'resize', add_classes: true, visualTranspose: state.transpose, clickListener: onClick };
                        if (state.tablature)
                            options.tablature = [{ instrument: state.tablature }];
                        state.visual = ABCJS.renderAbc(paper, state.abc, options);
                        title.textContent = abcFileName(state.abc, '');
                        steps.textContent = 'Transpose: ' + (state.transpose > 0 ? '+' : '') + state.transpose;
                    };

                    // Playing, with the notes being played highlighted.
                    let synth = null, timing = null, lit = [];
                    const unlight = () => { lit.forEach(e => e.classList.remove('abcjs-playing')); lit = []; };
                    const stop = () => {
                        if (synth) synth.stop();
                        if (timing) timing.stop();
                        synth = null;
                        timing = null;
                        unlight();
                        play.textContent = 'Play';
                    };
                    play.onclick = async () => {
                        if (synth) {
                            stop();
                            return;
                        }
                        const visual = state.visual[0];
                        if (!visual)
                            return;
                        try {
                            play.disabled = true;
                            setStatus('Loading the instrument samples...');
                            synth = await primeAbcSynth(visual, state.transpose);
                            timing = new ABCJS.TimingCallbacks(visual, {
                                eventCallback: (ev) => {
                                    unlight();
                                    if (!ev) {
                                        stop();
                                        return;
                                    }
                                    (ev.elements || []).forEach(group => group.forEach(e => { e.classList.add('abcjs-playing'); lit.push(e); }));
                                }
                            });
                            synth.start();
                            timing.start();
                            play.textContent = 'Stop';
                            setStatus(state.visual.length > 1 ? 'Playing the first tune.' : '');
                        } catch (e) {
                            stop();
                            setStatus('Could not play the tune: ' + e.message);
                        } finally {
                            play.disabled = false;
                        }
                    };

                    down.onclick = () => { stop(); state.transpose--; render(); };
                    up.onclick = () => { stop(); state.transpose++; render(); };
                    tab.onchange = () => { stop(); state.tablature = tab.value; render(); };
                    apply.onclick = () => {
                        const range = sourceRange();
                        if (!range || state.transpose === 0)
                            return;
                        const steps = state.transpose;
                        state.transpose = 0;
                        transposeAbcSource(editor, { range: range, abc: state.abc, offset: state.offset }, steps);
                    };
                    svg.onclick = () => {
                        const svgs = paper.querySelectorAll('svg');
                        svgs.forEach((s, i) => {
                            const copy = s.cloneNode(true);
                            copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                            const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(copy);
                            downloadBlob(new Blob([xml], { type: 'image/svg+xml' }), abcFileName(state.abc, svgs.length > 1 ? `-${i + 1}.svg` : '.svg'));
                        });
                    };
                    midi.onclick = () => downloadAbcMidi(state.abc, state.transpose);
                    wav.onclick = () => downloadAbcWav(state.abc, state.transpose, state.visual[0]);

                    // Live preview: draw again shortly after the source changes.
                    let timer = null;
                    const onEdit = model.onDidChangeContent(() => {
                        clearTimeout(timer);
                        timer = setTimeout(() => {
                            const range = sourceRange();
                            if (!range) {
                                setStatus('The source of the score was removed.');
                                return;
                            }
                            const tune = toAbcTune(model.getValueInRange(range));
                            if (!tune) {
                                setStatus('Not valid ABC notation: showing the last valid score.');
                                return;
                            }
                            stop();
                            state.abc = tune.abc;
                            state.offset = tune.offset;
                            setStatus('');
                            render();
                        }, 400);
                    });
                    const onModel = editor.onDidChangeModel(() => abcPanel && abcPanel.close());

                    abcPanel = {
                        close: () => {
                            stop();
                            clearTimeout(timer);
                            onEdit.dispose();
                            onModel.dispose();
                            if (!model.isDisposed())
                                decorations = model.deltaDecorations(decorations, []);
                            panel.remove();
                            abcPanel = null;
                        }
                    };
                    close.onclick = () => abcPanel.close();
                    panel.addEventListener('keydown', (e) => { if (e.key === 'Escape') abcPanel.close(); });
                    render();
                };

                // Warnings of abcjs as Monaco markers, for a file in the "abc" language only. abcjs reports
                // them as "Music Line:<line>:<column>: <message>:  <context>", the line counted from the
                // X: line of the tune (1) and the column from 1.
                const abcWarningMarkers = (text) => {
                    if (typeof ABCJS === 'undefined' || !text || text.length > ABC_MAX_SELECTION)
                        return [];
                    const prefix = /^[ \t]*X:/m.test(text) ? '' : 'X:1\n';
                    const abc = prefix + text;
                    const lineOf = (offset) => abc.substring(0, offset).split('\n').length - 1; // 0-based line in abc
                    const tuneStarts = [];
                    const x = /^[ \t]*X:/gm;
                    let m;
                    while ((m = x.exec(abc)) !== null)
                        tuneStarts.push(lineOf(m.index));
                    let tunes;
                    try {
                        tunes = ABCJS.parseOnly(abc);
                    } catch (e) {
                        return [{ severity: monaco.MarkerSeverity.Error, message: 'abcjs could not read the file: ' + e.message, startLineNumber: 1, startColumn: 1, endLineNumber: 1, endColumn: 2 }];
                    }
                    const prefixLines = prefix ? 1 : 0;
                    const markers = [];
                    tunes.forEach((tune, i) => {
                        const start = tuneStarts[i] !== undefined ? tuneStarts[i] : 0;
                        (tune.warnings || []).forEach(warning => {
                            const plain = String(warning).replace(/<[^>]*>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
                            const w = plain.match(/^[^:]*Line:(\d+):(\d+):\s*([^]*?)(?::\s{2}[^]*)?$/);
                            const line0 = w ? start + Number(w[1]) - 1 : start;
                            const lineNumber = Math.max(1, line0 - prefixLines + 1);
                            const column = w ? Math.max(1, Number(w[2])) : 1;
                            markers.push({
                                severity: monaco.MarkerSeverity.Warning,
                                message: w ? w[3].trim() : plain,
                                source: 'abcjs',
                                startLineNumber: lineNumber,
                                startColumn: column,
                                endLineNumber: lineNumber,
                                endColumn: column + 1
                            });
                        });
                    });
                    return markers;
                };

                // The ABC menu items, shown while there is ABC to work on (context key welsonjs.abcAvailable,
                // checked shortly after the selection, the text or the language changes), and the warnings
                // of a file in the "abc" language.
                const registerAbcActions = (editor) => {
                    registerAbcLanguage();
                    const available = editor.createContextKey('welsonjs.abcAvailable', false);
                    let timer = null, warningTimer = null;
                    const update = () => {
                        clearTimeout(timer);
                        timer = setTimeout(() => available.set(getAbcSource(editor) !== null), 200);
                    };
                    const updateWarnings = () => {
                        clearTimeout(warningTimer);
                        warningTimer = setTimeout(() => {
                            const model = editor.getModel();
                            if (!model)
                                return;
                            monaco.editor.setModelMarkers(model, 'abcjs',
                                model.getLanguageId() === 'abc' ? abcWarningMarkers(model.getValue()) : []);
                        }, 500);
                    };
                    editor.onDidChangeCursorSelection(update);
                    editor.onDidChangeModelContent(() => { update(); updateWarnings(); });
                    editor.onDidChangeModelLanguage(() => { update(); updateWarnings(); });
                    editor.onDidChangeModel(() => { update(); updateWarnings(); });

                    const add = (id, label, order, action) => editor.addAction({
                        id: 'welsonjs.abc.' + id,
                        label: label + ' (ABC notation)',
                        precondition: 'welsonjs.abcAvailable',
                        contextMenuGroupId: '3_music',
                        contextMenuOrder: order,
                        run: () => {
                            const source = getAbcSource(editor);
                            if (source) action(source);
                        }
                    });
                    add('showScore', 'Show Score', 1, (source) => openAbcScore(editor, source));
                    add('downloadMidi', 'Download MIDI', 2, (source) => downloadAbcMidi(source.abc, 0));
                    add('downloadWav', 'Download WAV', 3, (source) => downloadAbcWav(source.abc, 0));
                    add('transposeUp', 'Transpose Up a Semitone', 4, (source) => transposeAbcSource(editor, source, 1));
                    add('transposeDown', 'Transpose Down a Semitone', 5, (source) => transposeAbcSource(editor, source, -1));
                };

                const registerAiActions = (editor) => {
                    aiEditorRef.current = editor;
                    registerAiServiceActions(aiServiceKey);
                    registerAnalysisActions(editor);
                    registerAbcActions(editor);
                };

                // When the launcher's model list (or translation model) arrives, keep the chosen
                // service if it is still offered (re-registering its actions), or switch to the first one.
                React.useEffect(() => {
                    const key = AI_SERVICES[aiServiceKey] ? aiServiceKey : Object.keys(AI_SERVICES)[0];
                    if (key !== aiServiceKey)
                        setAiServiceKey(key);
                    registerAiServiceActions(key);
                }, [localModels, translationModel, translatedModels]);

                // Ribbon toggle: switches to the next AI service and starts over with an empty
                // prompt, so the new model does not continue another model's conversation.
                const toggleAiService = () => {
                    const keys = Object.keys(AI_SERVICES);
                    const key = keys[(keys.indexOf(aiServiceKey) + 1) % keys.length];

                    setAiServiceKey(key);
                    try {
                        localStorage.setItem(AI_SERVICE_STORAGE_KEY, key);
                    } catch (e) {}
                    registerAiServiceActions(key);

                    if (promptMessagesRef.current.length > 0) {
                        promptMessagesRef.current = [];
                        notifyPromptMessages(null);
                    }
                };

                const savePromptMessages = () => {
                    const text = JSON.stringify(promptMessagesRef.current, null, 4);
                    const blob = new Blob([text], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = "prompt.json";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                const loadPromptMessages = () => {
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = '.json';
                    fileInput.onchange = function (event) {
                        const file = event.target.files[0];

                        if (!file)
                            return;

                        let reader = new FileReader();
                        reader.onload = function (e) {
                            promptMessagesRef.current = JSON.parse(e.target.result);
                            notifyPromptMessages(null);
                            appendTextToEditor("\n//Prompt loaded successfully.");
                        };
                        reader.readAsText(file);
                    };
                    fileInput.click();
                };

                const queryWhois = () => {
                    const hostname = prompt("Enter a hostname or IP address:", '');
                    if (!hostname || hostname.trim() == '') {
                        appendTextToEditor("\n// A hostname or IP address is required.");
                        return;
                    }

                    axios.get(`/whois/${hostname}`).then(response => {
                        const responseText = DOMPurify.sanitize(response.data, { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
                        appendTextToEditor(`/*\nHostname:${hostname}\n\n${responseText}\n*/`);
                        pushPromptMessage("system", responseText);
                    }).catch(error => {
                        console.error(error);
                    });
                };

                const queryDns = () => {
                    const hostname = prompt("Enter a hostname or IP address:", '');
                    if (!hostname || hostname.trim() == '') {
                        appendTextToEditor("\n// A hostname or IP address is required.");
                        return;
                    }

                    axios.get(`/dns-query/${encodeURIComponent(hostname.trim())}`).then(response => {
                        const responseText = response.data;
                        appendTextToEditor(`/*\nHostname:${hostname}\n\n${responseText}\n*/`);
                        pushPromptMessage("system", responseText);
                    }).catch(error => {
                        console.error(error);
                    });
                };

                const queryIp = () => {
                    const hostname = prompt("Enter IP address:", '');
                    if (!hostname || hostname.trim() === '') {
                        appendTextToEditor("\n// IP address is required.");
                        return;
                    }
                    const ip = encodeURIComponent(hostname.trim());

                    axios.get(`/ip-query/${hostname}`).then(res => {
                        if (!res || !res.data) {
                            appendTextToEditor("\n// No data returned from server.");
                            return;
                        }

                        // Parse XML and keep attributes (provider, status)
                        const parser = new XMLParser({ ignoreAttributes: false, attributeNamePrefix: "@_" });
                        const parsed = parser.parse(res.data);

                        // Expected XML:
                        // <result target="...">
                        //   <response provider="criminalip" status="200">
                        //     <text>{ "...raw json..." }</text>
                        //   </response>
                        //   <response provider="abuseipdb" status="200">
                        //     <text>{ "...raw json..." }</text>
                        //   </response>
                        // </result>

                        // Normalize to an array of <response> nodes
                        const responsesNode = parsed?.result?.response;
                        const responses = Array.isArray(responsesNode)
                            ? responsesNode
                            : (responsesNode ? [responsesNode] : []);

                        if (responses.length === 0) {
                            appendTextToEditor("\n// No <response> nodes found.");
                            return;
                        }

                        // Extract each <response><text> content and print
                        let out = "\n// --- IP Query Results ---";
                        for (const r of responses) {
                            const provider = r?.["@_provider"] || "unknown";
                            const status = r?.["@_status"] || "n/a";

                            // Fast-XML-Parser usually makes <text> a string, but be safe:
                            let txt = r?.text;
                            if (txt && typeof txt === "object") {
                                // If parser produced an object with a '#text' key or similar
                                txt = txt["#text"] || JSON.stringify(txt);
                            }
                            if (txt == null) txt = "";

                            out += `\n// provider=${provider}, status=${status}\n${txt}\n`;
                        }
                        out = "\n/*" + out + "*/\n";

                        appendTextToEditor(out);
                        pushPromptMessage("system", out);
                    }).catch(error => {
                        console.error(error);
                        appendTextToEditor(`\n// Failed to query the IP: ${error.message}`);
                    });
                };
                
                const extractCoordinates = (source) => {
                    const coordinates = [];
                    const seen = {};
                    const pattern = /(-?\d{1,3}(?:\.\d+)?)\s*[,;]\s*(-?\d{1,3}(?:\.\d+)?)/g;
                    let match;

                    while ((match = pattern.exec(source || '')) !== null) {
                        const latitude = Number(match[1]);
                        const longitude = Number(match[2]);
                        if (latitude < -90 || latitude > 90 || longitude < -180 || longitude > 180)
                            continue;

                        const key = latitude + ',' + longitude;
                        if (!seen[key]) {
                            seen[key] = true;
                            coordinates.push({ latitude: latitude, longitude: longitude });
                        }
                    }

                    return coordinates;
                };

                const plotEditorCoordinates = () => {
                    const map = mapViewRef.current;
                    if (!map || typeof L === 'undefined')
                        return;

                    coordinateMarkersRef.current.forEach(marker => map.removeLayer(marker));
                    coordinateMarkersRef.current = [];

                    const coordinates = extractCoordinates(editorRef.current ? editorRef.current.getValue() : '');
                    const bounds = [];
                    coordinates.forEach(coordinate => {
                        const latlng = [coordinate.latitude, coordinate.longitude];
                        const marker = L.marker(latlng)
                            .addTo(map)
                            .bindPopup('Coordinate: ' + coordinate.latitude + ', ' + coordinate.longitude);
                        coordinateMarkersRef.current.push(marker);
                        bounds.push(latlng);
                    });

                    if (bounds.length === 1)
                        map.setView(bounds[0], 14);
                    else if (bounds.length > 1)
                        map.fitBounds(bounds, { padding: [30, 30] });
                };

                function toggleMap() {
                    const nextVisible = !showMap;
                    setShowMap(nextVisible);
                    if (nextVisible)
                        setTimeout(plotEditorCoordinates, 100);
                }

                const openDiscord = () => navigate('https://discord.gg/XKG5CjtXEj?utm_source=welsonjs');
                const openKakao = () => navigate('https://pf.kakao.com/_mNxisj');

                React.useEffect(() => {
                    window.addEventListener('resize', () => {
                        resizeEditor();
                    });
                    window.dispatchEvent(new Event('resize'));
                }, []);

                React.useEffect(() => {
                }, []);

                return _e('div', { className: 'app' },
                    _e(RibbonMenu, {
                        aiServiceName: (AI_SERVICES[aiServiceKey] || AI_SERVICES[Object.keys(AI_SERVICES)[0]]).name,
                        onAiServiceToggleClick: toggleAiService,
                        onOpenFileClick: openFile,
                        onSaveFileClick: saveFile,
                        onPromptEditorClick: openPromptEditor,
                        onSavePromptClick: savePromptMessages,
                        onLoadPromptClick: loadPromptMessages,
                        onQueryWhoisClick: queryWhois,
                        onQueryDnsClick: queryDns,
                        onQueryIpClick: queryIp,
                        onMapClick: toggleMap,
                        onRunScriptClick: runScript,
                        onTerminalClick: openTerminal,
                        onExcelExampleClick: showExcelExample,
                        onPowerPointExampleClick: showPowerPointExample,
                        onWordExampleClick: showWordExample,
                        onHwpExampleClick: showHwpExample,
                        onDiscordClick: openDiscord,
                        onKakaoClick: openKakao,
                        onWorldTouristExampleClick: showWorldTouristExample,
                    }),
                    _e('div', { id: 'container' },
                        _e(Editor, { editorRef: editorRef, visible: !showMap, onReady: registerAiActions }),
                        _e(MapView, { mapViewRef: mapViewRef, visible: showMap })
                    ),
                    _e('div', { className: 'banner' }, _e('a', { href: 'https://github.com/gnh1201/welsonjs' }, '❤️ Contribute this project')),
                );
            }

            const container = document.getElementById('app');
            const root = ReactDOM.createRoot(container);
            root.render(_e(App));
        });
    </script>
</body>
